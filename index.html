  <title>Zazzo's Big Prep</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{background:#EFEFEF;color:#111;font-family:'Inter',system-ui,sans-serif;font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased;}

    .H{position:relative;background:#C8102E;border-bottom:4px solid #1B6B3A;display:flex;align-items:center;flex-wrap:wrap;padding:10px 12px;gap:6px;row-gap:8px;z-index:200;}
    .H-logo{font-family:'Libre Baskerville',Georgia,serif;font-size:20px;font-weight:700;color:#fff;letter-spacing:0.04em;}
    .H-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
    .B{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 14px;border-radius:6px;font-family:'Inter',system-ui,sans-serif;font-size:12px;font-weight:700;cursor:pointer;border:2px solid transparent;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
    .B:active{opacity:0.75;}
    .B-ghost{background:transparent;border-color:rgba(255,255,255,0.5);color:#fff;}
    .B-outline{background:#fff;border-color:#E2E2E2;color:#111;}
    .B-red{background:#C8102E;border-color:#C8102E;color:#fff;}
    .B-lg{height:44px;padding:0 20px;font-size:14px;}

    /* LOGIN / HOME */
    .Login{min-height:100vh;background:#EFEFEF;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:36px;}
    .Login-logo{font-family:'Libre Baskerville',Georgia,serif;font-size:48px;font-weight:700;color:#C8102E;line-height:1;text-align:center;}
    .Login-tag{margin-top:10px;font-size:11px;font-weight:700;color:#777;letter-spacing:0.2em;text-transform:uppercase;text-align:center;}
    .Login-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:420px;}
    .LCard{background:#fff;border:2px solid #1B6B3A;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.07);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px 12px;min-height:130px;transition:border-color 0.15s,box-shadow 0.15s,transform 0.15s;user-select:none;-webkit-tap-highlight-color:transparent;text-align:center;}
    .LCard:active{transform:translateY(1px);}
    .LCard-emoji{font-size:28px;}
    .LCard-role{font-family:'Libre Baskerville',Georgia,serif;font-size:17px;font-weight:700;color:#111;}
    .LCard-sub{font-size:11px;font-weight:600;font-style:italic;color:#C8102E;}
    .LCard-status{font-size:10px;font-weight:700;color:#1B6B3A;margin-top:2px;}
    .LCard-status.active{color:#C8102E;}
    .MenuTile{background:#fff;border:2px solid #1B6B3A;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.07);cursor:pointer;display:flex;align-items:center;gap:16px;padding:20px;transition:border-color 0.15s,box-shadow 0.15s,transform 0.15s;user-select:none;-webkit-tap-highlight-color:transparent;}
    .MenuTile:active{transform:translateY(1px);}
    .MenuTile.primary{border-color:#C8102E;background:#FFF8F8;}
    .MenuTile-emoji{font-size:30px;flex-shrink:0;width:40px;text-align:center;}
    .MenuTile-title{font-family:'Libre Baskerville',Georgia,serif;font-size:18px;font-weight:700;color:#111;}
    .MenuTile-sub{font-size:11px;font-weight:600;font-style:italic;color:#C8102E;margin-top:2px;}

    /* PAGE */
    .Page{padding:12px 16px 100px;}

    /* ACCORDION */
    .LocBlock{border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08),0 0 0 1px rgba(0,0,0,0.04);margin-bottom:10px;background:#fff;}
    .LocHeader{display:flex;align-items:center;padding:13px 16px;gap:12px;user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer;}
    .LocHeader-arrow{font-size:18px;flex-shrink:0;transition:transform 0.2s;color:#C8102E;font-weight:700;}
    .LocHeader-arrow.open{transform:rotate(90deg);}
    .LocHeader-info{flex:1;min-width:0;}
    .LocHeader-name{font-family:'Libre Baskerville',Georgia,serif;font-size:15px;font-weight:700;color:#111;}
    .LocHeader-meta{font-size:11px;color:#777;margin-top:2px;}
    .LocHeader-badge{flex-shrink:0;font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;}
    .badge-done{background:#E8F5ED;color:#1B6B3A;}
    .badge-active{background:#FDECEA;color:#C8102E;}

    .LocBody{display:none;border-top:1px solid #F0F0F0;}
    .LocBody.open{display:block;}

    /* ITEMS */
    .ProdRow{display:flex;align-items:center;padding:9px 16px;border-bottom:1px solid #F5F5F5;gap:10px;}
    .ProdRow:last-child{border-bottom:none;}
    .ProdRow-info{flex:1;min-width:0;}
    .ProdRow-name{font-size:13px;font-weight:600;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .ProdRow-meta{font-size:11px;color:#777;margin-top:1px;}
    .ProdRow-total{color:#1B6B3A;font-weight:700;}

    .DualInput{display:flex;gap:5px;flex-shrink:0;}
    .IG{display:flex;flex-direction:column;align-items:center;gap:2px;}
    .IG label{font-size:9px;font-weight:700;color:#777;text-transform:uppercase;letter-spacing:0.06em;}
    .SI{width:54px;height:40px;border:2px solid #E2E2E2;border-radius:6px;background:#fff;color:#111;font-family:'Inter',system-ui,sans-serif;font-size:15px;font-weight:700;text-align:center;padding:0;-webkit-appearance:none;appearance:none;}
    .SI:focus{outline:none;border-color:#C8102E;}
    .SI::-webkit-inner-spin-button,.SI::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
    .SI.filled{background:#fff8f9;color:#C8102E;}
    .SI-readonly{width:54px;height:40px;border:2px dashed #1B6B3A;border-radius:6px;background:#F0F7F2;color:#1B6B3A;font-family:'Inter',system-ui,sans-serif;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;}

    /* FOOTER */
    .Footer{position:fixed;bottom:0;left:0;right:0;min-height:60px;background:#C8102E;border-top:4px solid #1B6B3A;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;row-gap:6px;padding:8px 12px;z-index:150;}
    .Footer-prog{font-size:12px;font-weight:700;color:rgba(255,255,255,0.9);text-align:center;flex:1;padding:0 8px;}
    .Fbtn{height:38px;padding:0 16px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid rgba(255,255,255,0.5);background:transparent;color:#fff;white-space:nowrap;-webkit-tap-highlight-color:transparent;font-family:'Inter',system-ui,sans-serif;}
    .Fbtn:active{background:rgba(255,255,255,0.15);}
    .Fbtn-next{background:#fff;color:#C8102E;border-color:#fff;}

    /* OVERLAY */
    .Overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px;}
    .Modal{background:#fff;border-radius:12px;padding:26px;max-width:400px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,0.22);}
    .Modal-title{font-family:'Libre Baskerville',Georgia,serif;font-size:18px;font-weight:700;color:#111;margin-bottom:8px;}
    .Modal-body{font-size:14px;color:#444;line-height:1.65;margin-bottom:18px;}
    .Modal-actions{display:flex;gap:10px;justify-content:flex-end;}
    .Modal-field{margin-bottom:14px;}
    .Modal-field label{display:block;font-size:11px;font-weight:700;color:#777;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;}
    .Modal-field input{width:100%;height:40px;border:2px solid #E2E2E2;border-radius:8px;padding:0 12px;font-family:'Inter',system-ui,sans-serif;font-size:14px;color:#111;}
    .Modal-field input:focus{outline:none;border-color:#C8102E;}
    .AvgRow{display:flex;font-size:13px;padding:5px 0;border-bottom:1px solid #F5F5F5;}
    .AvgRow:last-child{border-bottom:none;}
    .AvgRow-name{flex:1;color:#444;}
    .AvgRow-val{font-weight:700;color:#C8102E;font-family:'Inter',system-ui,sans-serif;}

    .Loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#999;font-size:13px;}

    /* PRINT */
    .print-show{display:none;}
    @media print{
      *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
      @page{margin:0.5in;size:letter portrait;}
      body > *{display:none!important;}
      #print-area{display:block!important;}
    }
  </style>
</head>

// ─── WEEK NUMBERING ──────────────────────────────────────────────────────────
// Week 1 = the Monday–Sunday of our first real data (Jul 6–12, 2026).
// Both locations share this same numbering so "Week 3" means the same
// calendar week on both sides, even if one side has no data for it yet.
const WEEK1_MONDAY = new Date(2026, 6, 6); // July 6, 2026, in LOCAL time — must match
// the local-time arithmetic used everywhere else (mondayOf, getDay, setDate, etc.)
// A UTC-anchored epoch here would shift every week boundary back a day for anyone
// in a negative UTC offset timezone (e.g. US) once formatted/compared locally.
const MS_PER_WEEK = 7*24*60*60*1000;
function weekNumberForDate(d){
  return Math.floor((d.getTime()-WEEK1_MONDAY.getTime())/MS_PER_WEEK)+1;
}
function weekRangeLabel(n){
  const mon=new Date(WEEK1_MONDAY.getTime()+(n-1)*MS_PER_WEEK);
  const sun=new Date(mon.getTime()+6*24*60*60*1000);
  const fmt=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  return fmt(mon)+' – '+fmt(sun);
}
function currentWeekNumber(){ return weekNumberForDate(new Date()); }

// Darien orders run Monday–Sunday. If an in-progress Darien week's Sunday has
// already passed and nobody closed it out, auto-complete it the next time
// anyone opens the app (there's no true background scheduler available here,
// so this "lazy" check on Home load is the practical substitute). It can
// still be fixed afterward with the normal Edit flow if something was missed.
async function autoCloseExpiredDarienWeek(){
  if(testMode) return;
  const {data}=await sb.from(TABLE).select('*').eq('location','darien').eq('status','in_progress').order('started_at',{ascending:false}).limit(1);
  if(!data || !data.length) return;
  const row=data[0];
  const wk=weekNumberForDate(new Date(row.started_at));
  const weekEnd=new Date(WEEK1_MONDAY.getTime()+wk*MS_PER_WEEK); // the following Monday = end of this week
  if(new Date()>=weekEnd){
    await sb.from(TABLE).update({
      status:'completed',
      completed_at:new Date().toISOString(),
      acknowledged:false,
      acknowledged_at:null,
    }).eq('id',row.id);
  }
}

    </div>`;
  }).join('') || '<div style="padding:20px;text-align:center;color:#999;font-size:13px;">No history yet for this record.</div>';

  app.innerHTML = `
    <header class="H no-print">
      <div class="H-logo">History</div>

    </header>

  document.getElementById('bHistoryBack').onclick=backFn;
  const idField = tableName==='darien_daily_onhand' ? 'date' : 'id';
  snapshots.forEach(s=>{
    const btn=document.querySelector(`[data-revert="${s.id}"]`);
    if(btn) btn.onclick=()=>{
      showModal('Revert to this version?','This replaces the current numbers with this older version. The current version gets saved to history first, so this can be undone too.',[
        {l:'Cancel',c:'B-outline',fn:closeModal},
        {l:'Revert',c:'B-red',fn:async ()=>{
          closeModal();
          showLoading();

          if(current && current.length) await saveSnapshot(tableName, recordId, current[0][fieldName]||{}, 'Before revert');
          await sb.from(tableName).update({[fieldName]:s.snapshot}).eq(idField,recordId);
          backFn();
        }},
      ]);
    };
  });
}

async function getDarienOwedMap(){
  if(testMode) return {};
  const owed={};
  const {data:latestD}=await sb.from(TABLE).select('*').eq('location','darien').eq('status','completed').order('completed_at',{ascending:false}).limit(1);
  if(latestD && latestD.length){
    const mainDelivered=latestD[0].delivered||{};
    ALL_ITEMS.forEach(item=>{
      const ordered=Number(latestD[0].counts?.[item.id]||0);
      if(ordered<=0) return;
      const delivered=Number(mainDelivered[item.id]||0);
      owed[item.id]=Math.max(ordered-delivered,0);
    });
  }
  const openAddons=await getOpenAddons();
  openAddons.forEach(a=>{
    const items=a.items||{}, delivered=a.delivered||{};
    Object.keys(items).forEach(itemId=>{
      const requested=Number(items[itemId]||0);
      const del=Number(delivered[itemId]||0);
      const remaining=Math.max(requested-del,0);
      if(remaining>0) owed[itemId]=(owed[itemId]||0)+remaining;
    });
  });
  return owed;
}

// Total committed to Darien THIS WEEK — main Need + every add-on tied to this
// same week, regardless of whether it's already been delivered or not. Once
// something is allocated to Darien, it's off Westmont's shelf whether the
// physical delivery already happened or is still pending — so True Count
// must subtract the full amount, not just what's still outstanding.
async function getDarienAllocatedMap(){
  if(testMode) return {};
  const allocated={};
  const {data:latestD}=await sb.from(TABLE).select('*').eq('location','darien').eq('status','completed').order('completed_at',{ascending:false}).limit(1);
  let weekLabel=null;
  if(latestD && latestD.length){
    weekLabel=latestD[0].week_label;
    ALL_ITEMS.forEach(item=>{
      const ordered=Number(latestD[0].counts?.[item.id]||0);
      if(ordered>0) allocated[item.id]=ordered;
    });
  }
  if(weekLabel){
    const {data:addons}=await sb.from('darien_addons').select('*').eq('week_label',weekLabel);
    (addons||[]).forEach(a=>{
      const items=a.items||{};
      Object.keys(items).forEach(itemId=>{
        const requested=Number(items[itemId]||0);
        if(requested>0) allocated[itemId]=(allocated[itemId]||0)+requested;
      });
    });
  }
  return allocated;
}


function defaultWeekLabel(){
  const d=new Date(); const day=d.getDay();
  const monday=new Date(d); monday.setDate(d.getDate()-((day+6)%7));
  return 'Week of '+monday.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function mondayOf(d){
  const day=d.getDay();
  const diff=(day+6)%7; // days since Monday (Mon=0 ... Sun=6)
  const mon=new Date(d);
  mon.setHours(0,0,0,0);
  mon.setDate(mon.getDate()-diff);
  return mon;
}
// Darien-specific: a Sunday order is for the week that starts the NEXT day
// (weeks run Mon–Sun, so Sunday is the last day of the week it falls in —
// but an order placed on Sunday is for the upcoming week, not that one).
// Anything picked Mon–Sat just falls in its own normal Mon–Sun week.
function targetMondayForDarienOrder(picked){
  if(picked.getDay()===0){
    const nextMon=new Date(picked);
    nextMon.setHours(0,0,0,0);
    nextMon.setDate(nextMon.getDate()+1);
    return nextMon;
  }
  return mondayOf(picked);
}
function mostRecentSunday(d){
  const sun=new Date(d);
  sun.setHours(0,0,0,0);
  sun.setDate(sun.getDate()-sun.getDay());
  return sun;
}

// Darien only orders items that have a par set - anything without one
// (chicken parm, grilled chicken, lemon chicken, ribs, wings) doesn't show
// up for them at all, though Westmont's own counts are unaffected.
function visibleCatItems(cat){
  if(activeLoc!=='darien') return cat.items;
  return cat.items.filter(i=>currentPars[i.id]!=null);
}
function catFilledCount(cat){ return visibleCatItems(cat).filter(i=>(session.counts[i.id]??'')!=='' ).length; }
function catComplete(cat){ return visibleCatItems(cat).every(i=>(session.counts[i.id]??'')!=='' ); }
function totalItems(){ return activeLoc==='darien' ? CATEGORIES.reduce((s,c)=>s+visibleCatItems(c).length,0) : ALL_ITEMS.length; }
function totalCounted(){ return (activeLoc==='darien' ? CATEGORIES.flatMap(visibleCatItems) : ALL_ITEMS).filter(i=>(session.counts[i.id]??'')!=='' ).length; }
function allComplete(){ return CATEGORIES.every(catComplete); }

// Read-only: Item | Par | last 3 days' on-hand | Average — from the Daily
// On-Hand table, not the weekly order.
async function showDarienCountsView(backFn){
  backFn = backFn || (()=>showCountsMenu());
  showLoading();
  const darienPars=await loadPars('darien');
  const {data:recentAll}=await sb.from('darien_daily_onhand').select('*').order('date',{ascending:false}).limit(60);
  const days=(recentAll||[]).slice(0,3).sort((a,b)=>new Date(b.date)-new Date(a.date));

  const headerCells=days.map(d=>`<th style="padding:8px 6px;font-size:9px;color:#999;text-transform:uppercase;">${new Date(d.date+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</th>`).join('');
  const rows = ALL_ITEMS.map(item=>{
    const par=darienPars[item.id];
    const vals=days.map(d=>Number(d.counts?.[item.id]??null));
    const validVals=vals.filter(v=>!isNaN(v) && v!==null);
    // Aggregate average uses EVERY day ever logged for this item, not just
    // the 3 displayed columns above.
    const allValsForItem=(recentAll||[]).map(d=>Number(d.counts?.[item.id]??null)).filter(v=>!isNaN(v) && v!==null);
    if(par==null && validVals.length===0 && allValsForItem.length===0) return '';
    const aggregateAvg = allValsForItem.length ? (allValsForItem.reduce((a,b)=>a+b,0)/allValsForItem.length).toFixed(1) : '—';
    const cells=days.map((d,i)=>`<td style="padding:8px 6px;font-size:12px;text-align:center;font-weight:600;">${isNaN(vals[i])?'—':vals[i]}</td>`).join('');
    return `<tr>
      <td style="padding:8px 10px;font-size:12px;font-weight:600;">${item.name}${par!=null?` <span style="color:#999;font-weight:400;">(Par: ${par})</span>`:''}</td>
      ${cells}
      <td style="padding:8px 6px;font-size:12px;text-align:center;font-weight:700;color:#C8102E;">${aggregateAvg}</td>
    </tr>`;
  }).join('');

  app.innerHTML = `

      <div class="H-logo">Live Counts</div>
      <div class="H-right"><button class="B B-ghost" id="bDarienCountsBack">← Back</button></div>

// Tapping a log entry shows the REAL structured data behind it, not just
// the one-line description.
async function showLogEventDetail(orderId, weekLabel, event){
  showLoading();
  const {data:orderRows}=await sb.from(TABLE).select('*').eq('id',orderId).limit(1);
  const order=(orderRows&&orderRows.length)?orderRows[0]:null;
  const {data:weekAddons}=await sb.from('darien_addons').select('*').eq('week_label',weekLabel);
  const addons=weekAddons||[];

  let title='Details', rows='';

  if(['placed','edited','acknowledged'].includes(event.event_type)){
    title='Order Items';
    rows = order ? ALL_ITEMS.map(item=>{
      const val=order.counts?.[item.id];
      if(val==null || val==='' || Number(val)<=0) return '';
      return `<div class="ProdRow"><div class="ProdRow-info"><div class="ProdRow-name">${item.name}</div><div class="ProdRow-meta">${item.unit}</div></div><div style="font-weight:700;">${val}</div></div>`;
    }).join('') : '';
  } else if(event.event_type==='picked_up'){
    title='Items Picked Up';
    const delivered=order?.delivered||{};
    rows = ALL_ITEMS.map(item=>{
      const mainQty=Number(delivered[item.id]||0);
      const addonQty=addons.reduce((s,a)=>s+Number((a.delivered||{})[item.id]||0),0);
      const total=mainQty+addonQty;
      if(total<=0) return '';
      return `<div class="ProdRow"><div class="ProdRow-info"><div class="ProdRow-name">${item.name}</div><div class="ProdRow-meta">${mainQty>0?'Sunday: '+mainQty:''}${mainQty>0&&addonQty>0?' · ':''}${addonQty>0?'Add-On: '+addonQty:''}</div></div><div style="font-weight:700;color:#1B6B3A;">✅ ${total}</div></div>`;
    }).join('');
  } else if(event.event_type==='verified_correct' || event.event_type==='reported_missing'){
    const {data:verifs}=await sb.from('darien_verifications').select('*').eq('order_id',orderId).order('verified_at',{ascending:false});
    const matching=(verifs||[]).find(v=>Math.abs(new Date(v.verified_at)-new Date(event.created_at))<5000) || (verifs&&verifs[0]);
    if(matching && !matching.is_correct){
      title='Missing Items Reported';
      rows = Object.keys(matching.missing_items||{}).map(k=>{
        const item=ITEM_BY_ID[k]; if(!item) return '';
        return `<div class="ProdRow"><div class="ProdRow-info"><div class="ProdRow-name">${item.name}</div></div><div style="font-weight:700;color:#C8102E;">${matching.missing_items[k]} short</div></div>`;
      }).join('');
    } else {
      title='Items Confirmed Matching';
      rows = order ? ALL_ITEMS.map(item=>{
        const ordered=Number(order.counts?.[item.id]||0);
        const addonQty=addons.reduce((s,a)=>s+Number((a.items||{})[item.id]||0),0);
        const total=ordered+addonQty;
        if(total<=0) return '';
        return `<div class="ProdRow"><div class="ProdRow-info"><div class="ProdRow-name">${item.name}</div></div><div style="font-weight:700;color:#1B6B3A;">✅ ${total}</div></div>`;
      }).join('') : '';
    }
  } else if(event.event_type==='addon_submitted' || event.event_type==='addon_edited'){
    title='Add-On Items';
    rows = addons.map(a=>`<div style="padding:8px 16px;font-size:11px;font-weight:700;color:#777;text-transform:uppercase;">${a.requested_by||'Unnamed'} · ${new Date(a.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>` +
      Object.keys(a.items||{}).map(k=>{ const item=ITEM_BY_ID[k]; if(!item) return ''; return `<div class="ProdRow"><div class="ProdRow-info"><div class="ProdRow-name">${item.name}</div></div><div style="font-weight:700;color:#1B6B3A;">${a.items[k]}</div></div>`; }).join('')
    ).join('');
  }

  app.innerHTML = `
    <header class="H no-print">
      <div class="H-logo">${title}</div>
      <div class="H-right"><button class="B B-ghost" id="bEventDetailBack">← Thread</button></div>
    </header>
    <div class="Page" style="padding-top:12px;">
      <div style="font-size:12px;color:#777;margin-bottom:12px;">${event.description}</div>
      <div class="LocBlock">${rows || '<div style="padding:20px;text-align:center;color:#999;font-size:13px;">Nothing to show for this event.</div>'}</div>
    </div>`;

  document.getElementById('bEventDetailBack').onclick=()=>showOrderLog(orderId, weekLabel);
}

// ─── EDIT A COMPLETED ORDER/COUNT ────────────────────────────────────────────
// Reopens a finished week for correction. Once re-finished, it overrides that
// same row — for Darien this also resets acknowledged back to false, so
// Westmont has to review + acknowledge the corrected numbers just like new.
async function editCompletedOrder(row){
  activeLoc=row.location;
  const originalCountsSnapshot = JSON.stringify(row.counts||{});
  if(!testMode) await saveSnapshot('prep_counts', row.id, row.counts||{}, row.week_label+' — before edit');
  // Important: do NOT write status:'in_progress' to the database here. If we
  // did, and the person backs out without re-completing, the row is left
  // stuck broken — it still has real finished data, but every "latest
  // completed" lookup would skip right past it. Instead, only the LOCAL
  // session object is marked in_progress for the UI; the database row stays
  // exactly as it was (completed) until Complete is actually tapped again.
  session={...row, counts:{...row.counts}, status:'in_progress', _originalCounts:originalCountsSnapshot};
  if(testMode) testSessions[row.location]=session;
  openCat=CATEGORIES[0].name;
  currentPars=await loadPars(row.location);
  currentDarienOwed = row.location==='westmont' ? await getDarienAllocatedMap() : {};
  showCount();
}

async function goToCounting(lk){
  activeLoc=lk;
  if(testMode){
    if(testSessions[lk]){ session=testSessions[lk]; openCat=CATEGORIES[0].name; currentPars=await loadPars(lk); currentDarienOwed = lk==='westmont' ? await getDarienAllocatedMap() : {}; showCount(); }
    else showSetupModal(lk);
    return;
  }
  showLoading();
  const {data}=await sb.from(TABLE).select('*').eq('location',lk).eq('status','in_progress').order('started_at',{ascending:false}).limit(1);
  if(data && data.length){
    session=data[0];
    session.counts=session.counts||{};
    openCat=CATEGORIES[0].name;
    currentPars=await loadPars(lk);
    currentDarienOwed = lk==='westmont' ? await getDarienAllocatedMap() : {};
    showCount();
  } else {
    showSetupModal(lk);
  }
}

// ─── DASHBOARD ───────────────────────────────────────────────────────────────
async function showDashboard(lk){
  activeLoc=lk;
  showLoading();
  const l=LOCATIONS[lk];
  let sessions=[];
  if(testMode){
    if(testSessions[lk]) sessions=[testSessions[lk]];
  } else {
    const {data,error}=await sb.from(TABLE).select('*').eq('location',lk).order('started_at',{ascending:true});
    if(!error) sessions=data||[];
  }
  const pars = await loadPars(lk);
  const pendingDarien = lk==='westmont' ? await getPendingDarienOrders() : [];
  const openAddons = await getOpenAddons();
  const dailyOnHand = lk==='westmont' && !testMode ? await getLatestDailyOnHand() : null;

  // What Westmont currently owes Darien — shared logic, also used on the
  // actual Count screen so the subtraction shows up while you're typing,
  // not just afterward on the dashboard.
  const darienNeedMap = (lk==='westmont') ? await getDarienAllocatedMap() : {};

  const curWeek=currentWeekNumber();
  if(selectedWeek==null || selectedWeek>curWeek) selectedWeek=curWeek;

  const weekMap={};
  sessions.forEach(s=>{
    const dateStr=s.completed_at||s.started_at;
    const wk=weekNumberForDate(new Date(dateStr));
    const existing=weekMap[wk];
    if(!existing) weekMap[wk]=s;
    else {
      const existingDate=new Date(existing.completed_at||existing.started_at);
      const thisDate=new Date(dateStr);
      const thisBetter = (s.status==='completed' && existing.status!=='completed') || thisDate>existingDate;
      if(thisBetter) weekMap[wk]=s;
    }
  });

  const completedSessions=sessions.filter(s=>s.status==='completed').sort((a,b)=>new Date(b.completed_at)-new Date(a.completed_at)).slice(0,6);
  const averages={};
  ALL_ITEMS.forEach(item=>{
    if(completedSessions.length===0){ averages[item.id]=null; return; }
    const vals=completedSessions.map(s=>Number(s.counts?.[item.id]||0));
    averages[item.id]=vals.reduce((a,b)=>a+b,0)/vals.length;
  });

  const maxDataWeek = sessions.length ? Math.max(...sessions.map(s=>weekNumberForDate(new Date(s.completed_at||s.started_at)))) : curWeek;
  const lastTab = Math.max(curWeek+1, maxDataWeek); // always show at least one week ahead
  const weekTabs=[];
  for(let w=1; w<=lastTab; w++) weekTabs.push(w);

  const activeSession=weekMap[selectedWeek];

  const showDarienCols = lk==='westmont' && selectedWeek===curWeek;
  const showOrderedCol = lk==='darien' && selectedWeek===curWeek && activeSession;

  let weekAddons=[];
  if(showOrderedCol){
    const {data}=await sb.from('darien_addons').select('*').eq('week_label',activeSession.week_label);
    weekAddons=data||[];
  }

  const headerRow = `<div class="ProdRow" style="background:#F7F7F7;">
    <div class="ProdRow-info"><div style="font-size:10px;color:#999;font-weight:700;text-transform:uppercase;">Item</div></div>
    <div style="display:flex;gap:14px;align-items:center;text-align:center;flex-shrink:0;">
      ${lk==='westmont'?'':'<div style="width:44px;font-size:10px;color:#999;font-weight:700;text-transform:uppercase;">Par</div>'}
      <div style="width:54px;font-size:10px;color:#999;font-weight:700;text-transform:uppercase;">Count</div>
      ${showOrderedCol?'<div style="width:54px;font-size:10px;color:#1B6B3A;font-weight:700;text-transform:uppercase;">Ordered</div>':''}
      ${showDarienCols?'<div style="width:50px;font-size:10px;color:#8A6300;font-weight:700;text-transform:uppercase;">− Darien</div><div style="width:64px;font-size:10px;color:#1B6B3A;font-weight:700;text-transform:uppercase;">True</div>':''}
      <div style="width:44px;font-size:10px;color:#999;font-weight:700;text-transform:uppercase;">Avg</div>
    </div>
  </div>`;

  const rows = ALL_ITEMS.map(item=>{
    const countVal = activeSession ? (activeSession.counts?.[item.id] ?? '') : '';
    const countTxt = countVal!=='' ? countVal : '—';
    const avgTxt = averages[item.id]!=null ? averages[item.id].toFixed(1) : '—';
    const parTxt = pars[item.id]!=null ? pars[item.id] : '—';
    const inProgTag = activeSession && activeSession.status==='in_progress' ? ' <span style="color:#C8102E;font-weight:700;">(in progress)</span>' : '';

    let orderedCell='', orderedHighlight='';
    if(showOrderedCol){
      const par=pars[item.id];
      if(par!=null && countVal!==''){
        const baseOrder=Number(countVal);
        let addonQty=0, addonDelivered=0, mainDelivered=Number((activeSession.delivered||{})[item.id]||0);
        weekAddons.forEach(a=>{
          const req=Number((a.items||{})[item.id]||0);
          addonQty+=req;
          addonDelivered+=Number((a.delivered||{})[item.id]||0);
        });
        const ordered=baseOrder+addonQty;
        if(ordered>0){
          const totalDelivered=mainDelivered+addonDelivered;
          const received = totalDelivered>=ordered;
          if(received) orderedHighlight='background:#E8F5ED;';
          orderedCell=`<div style="width:54px;">
            <div style="font-size:13px;font-weight:700;color:#1B6B3A;">${ordered}${received?' ✅':''}</div>
            ${addonQty>0?`<div style="font-size:9px;font-weight:700;color:#1B6B3A;">+${addonQty}</div>`:''}
          </div>`;
        } else {
          orderedCell=`<div style="width:54px;font-size:13px;color:#ccc;">—</div>`;
        }
      } else {
        orderedCell=`<div style="width:54px;font-size:13px;color:#ccc;">—</div>`;
      }
    }

    let darienCell='', trueCell='', rowHighlight=orderedHighlight;
    if(showDarienCols){
      const need=darienNeedMap[item.id];
      if(need!=null && need>0){
        rowHighlight='background:#FFFBF0;';
        darienCell=`<div style="width:50px;font-size:13px;font-weight:700;color:#8A6300;">${need}</div>`;
        if(countVal!==''){
          const trueCount=Number(countVal)-need;
          const tc=trueCount<0?'#C8102E':'#1B6B3A';
          trueCell=`<div style="width:64px;font-size:13px;font-weight:700;color:${tc};">${trueCount}</div>`;
        } else {
          trueCell=`<div style="width:64px;font-size:13px;color:#999;">—</div>`;
        }
      } else {
        darienCell=`<div style="width:50px;font-size:13px;color:#ccc;">—</div>`;
        trueCell=`<div style="width:64px;font-size:13px;color:#ccc;">—</div>`;
      }
    }

    return `<div class="ProdRow" style="${rowHighlight}">
      <div class="ProdRow-info">
        <div class="ProdRow-name">${item.name}</div>
        <div class="ProdRow-meta">${item.unit}</div>
      </div>
      <div style="display:flex;gap:14px;align-items:center;text-align:center;flex-shrink:0;">
        ${lk==='westmont'?'':`<div style="width:44px;font-size:13px;color:${pars[item.id]!=null?'#111':'#ccc'};font-weight:${pars[item.id]!=null?'700':'400'};">${parTxt}</div>`}
        <div style="width:54px;font-size:13px;font-weight:700;color:#111;">${countTxt}${inProgTag}</div>
        ${orderedCell}
        ${darienCell}${trueCell}
        <div style="width:44px;font-size:13px;font-weight:700;color:#C8102E;">${avgTxt}</div>
      </div>
    </div>`;
  }).join('');

  app.innerHTML = `
    <header class="H no-print">
      <div class="H-logo">${l.abbr}</div>
      <div class="H-right">
        ${lk==='westmont' && !testMode ? `<button class="B ${openAddons.length?'B-red':'B-ghost'}" id="bDeliveries">🚚 Tracker${openAddons.length?' ('+openAddons.length+')':''}</button>` : ''}
        ${lk==='westmont' ? `<button class="B ${pendingDarien.length?'B-red':'B-ghost'}" id="bDarienOrders">📦 Darien${pendingDarien.length?' ('+pendingDarien.length+')':''}</button>` : ''}
        ${lk==='darien' && !testMode ? `<button class="B B-ghost" id="bDarienTracker">📋 Tracker</button>` : ''}
        <button class="B B-ghost" id="bDashNotes">📝 Notes</button>
        <button class="B B-ghost" id="bDashHome">🏠 Home</button>
      </div>
    </header>
    <div class="Page" style="padding-top:12px;">
      ${testMode?'<div style="background:#FDECEA;color:#C8102E;font-size:12px;font-weight:700;padding:8px 12px;border-radius:8px;margin-bottom:10px;text-align:center;">🧪 TEST MODE — showing test data only</div>':''}
      ${dailyOnHand ? `<div style="background:#F0F7F2;color:#1B6B3A;font-size:11px;font-weight:700;padding:6px 12px;border-radius:8px;margin-bottom:10px;text-align:center;">📦 Darien on-hand as of ${new Date(dailyOnHand.date+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})} — <span style="text-decoration:underline;cursor:pointer;" id="bViewDailyOnHand">View</span></div>` : ''}
      ${lk==='westmont' && pendingDarien.length ? `<div style="background:#FDECEA;color:#C8102E;font-size:12px;font-weight:700;padding:10px 12px;border-radius:8px;margin-bottom:10px;text-align:center;">🔔 Darien has ${pendingDarien.length} order${pendingDarien.length!==1?'s':''} awaiting review — tap 📦 Darien above</div>` : ''}
      ${lk==='darien' && openAddons.length ? openAddons.map(a=>{
        const itemLines=Object.keys(a.items||{}).map(id=>{
          const it=ITEM_BY_ID[id]; if(!it) return '';
          const req=Number(a.items[id]||0), del=Number((a.delivered||{})[id]||0), rem=Math.max(req-del,0);
          return `<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0;"><span>${it.name}</span><span style="font-weight:700;color:${rem>0?'#8A6300':'#1B6B3A'};">${rem>0?rem+' still owed':'✓ received'}</span></div>`;
        }).join('');
        const dateStr=new Date(a.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'});
        return `<div style="background:#FFF6E0;border-radius:8px;padding:10px 14px;margin-bottom:10px;">

// ─── ORDER DETAIL (search any week, complete order + what happened) ─────────
async function showOrderDetail(order, backFn, title){
  backFn = backFn || (()=>showDarienOrders());
  const backLabel = title ? '← Westmont' : '← Darien Orders';
  showLoading();
  const darienPars=await loadPars('darien');
  const {data:weekAddons}=await sb.from('darien_addons').select('*').eq('week_label',order.week_label);
  const addons=weekAddons||[];

  const delivered=order.delivered||{};
  const certBy=order.counts?._certified_by;
  const certAt=order.counts?._certified_at;
  const completedStr=new Date(order.completed_at).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});

  const printItems=[];
  const itemRows = ALL_ITEMS.map(item=>{
    const par=darienPars[item.id];
    if(par==null) return '';
    const ordered_raw=Number(order.counts?.[item.id]||0);
    const onHandCalc=par-ordered_raw;
    const baseOrder=ordered_raw;
    let addonQty=0, addonDelivered=0;
    addons.forEach(a=>{
      addonQty+=Number((a.items||{})[item.id]||0);
      addonDelivered+=Number((a.delivered||{})[item.id]||0);
    });
    const ordered=baseOrder+addonQty;
    if(ordered<=0) return '';
    const pickedUp=Number(delivered[item.id]||0)+addonDelivered;
    const remaining=Math.max(ordered-pickedUp,0);
    const received=remaining<=0;
    printItems.push({item, ordered, pickedUp});
    return `<div class="ProdRow" style="${received?'background:#E8F5ED;':''}">
      <div class="ProdRow-info">
        <div class="ProdRow-name">${item.name}</div>
        <div class="ProdRow-meta">${item.unit} · Par ${par}</div>
      </div>
      <div style="display:flex;gap:14px;align-items:center;text-align:center;flex-shrink:0;">
        <div style="width:54px;"><div style="font-size:9px;color:#999;text-transform:uppercase;font-weight:700;">Ordered</div><div style="font-size:13px;font-weight:700;color:#111;">${ordered}</div>${addonQty>0?`<div style="font-size:9px;font-weight:700;color:#1B6B3A;">+${addonQty}</div>`:''}</div>
        <div style="width:54px;"><div style="font-size:9px;color:#8A6300;text-transform:uppercase;font-weight:700;">On Hand</div><div style="font-size:13px;font-weight:700;color:#8A6300;">${onHandCalc}</div></div>
        <div style="width:64px;"><div style="font-size:9px;color:#1B6B3A;text-transform:uppercase;font-weight:700;">Picked Up</div><div style="font-size:13px;font-weight:700;color:#1B6B3A;">${pickedUp}${received?' ✅':''}</div></div>
      </div>
    </div>`;
  }).join('');

  const addonRows = addons.map(a=>{
    const dateStr=new Date(a.created_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
    return `<div class="ProdRow">
      <div class="ProdRow-info">
        <div class="ProdRow-name">Add-On · ${a.requested_by||'Unnamed'}</div>
        <div class="ProdRow-meta">${dateStr}</div>
      </div>
      <span class="LocHeader-badge ${a.status==='fulfilled'?'badge-done':'badge-active'}">${a.status==='fulfilled'?'✓ Picked Up':'Open'}</span>
    </div>`;
  }).join('');

  app.innerHTML = `
    <header class="H no-print">
      <div class="H-logo">${title||order.week_label}</div>
      <div class="H-right">
        <button class="B B-ghost" id="bDetailHistory">🕐 History</button>
        <button class="B B-ghost" id="bDetailPrint">🖨 Print</button>
        <button class="B B-ghost" id="bDetailBack">${backLabel}</button>
      </div>
    </header>
    <div class="Page" style="padding-top:12px;">
      <div class="LocBlock" style="margin-bottom:16px;padding:14px 16px;">
        <div style="font-size:12px;color:#777;line-height:1.7;">
          ${title?`<div><strong>Week:</strong> ${order.week_label}</div>`:''}
          <div><strong>Counted by:</strong> ${order.counter_name}</div>
          ${certBy?`<div><strong>Certified by:</strong> ${certBy}</div>`:''}
          ${certAt?`<div><strong>Certified:</strong> ${new Date(certAt).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div>`:''}
          <div><strong>Completed:</strong> ${completedStr}</div>
          <div><strong>Acknowledged:</strong> ${order.acknowledged?'✓ Yes':'Not yet'}</div>
        </div>
      </div>
      <div style="font-size:12px;color:#777;font-weight:700;text-transform:uppercase;margin-bottom:8px;">Complete Order</div>
      <div class="LocBlock" style="margin-bottom:16px;">${itemRows || '<div style="padding:16px;text-align:center;color:#999;font-size:13px;">Nothing ordered this week.</div>'}</div>
      ${addons.length?'<div style="font-size:12px;color:#777;font-weight:700;text-transform:uppercase;margin-bottom:8px;">Add-Ons This Week</div><div class="LocBlock">'+addonRows+'</div>':''}
    </div>`;

  document.getElementById('bDetailBack').onclick=backFn;
  document.getElementById('bDetailPrint').onclick=()=>printTrackerSheet('ORDER DETAIL', order.week_label, printItems);
  document.getElementById('bDetailHistory').onclick=()=>showHistory('prep_counts', order.id, 'counts', ()=>showOrderDetail(order, backFn, title));
}

// ─── DAILY ON-HAND (Darien only) ─────────────────────────────────────────────
// Completely separate from the weekly Sunday order (prep_counts). Its own
// table, own history, one row per calendar day. Darien is the only one who
// can write to it. Westmont can only view it.
function todayDateStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

async function getLatestDailyOnHand(){
  const {data,error}=await sb.from('darien_daily_onhand').select('*').order('date',{ascending:false}).limit(1);
  if(error || !data || !data.length) return null;
  return data[0];
}

// ─── ADD-ON ORDERS (Darien side) ─────────────────────────────────────────────
// A lightweight, direct-quantity request that can be submitted any time
// during the week, separate from the standard weekly On Hand → Need order.
function showAddOnForm(existing, onDone){
  onDone = onDone || (()=>showDarienMenu());
  const weekLbl = existing ? existing.week_label : 'Week of '+targetMondayForDarienOrder(new Date()).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const existingItems = existing ? (existing.items||{}) : {};
  const rows = CATEGORIES.map(cat=>`
    <div style="margin-bottom:14px;">
      <div style="font-size:11px;font-weight:700;color:#999;text-transform:uppercase;margin-bottom:6px;">${cat.name}</div>
      <div class="LocBlock">
      ${cat.items.map(item=>`
        <div class="ProdRow">
          <div class="ProdRow-info">
            <div class="ProdRow-name">${item.name}</div>
            <div class="ProdRow-meta">${item.unit}</div>
          </div>
          <input class="SI" type="number" min="0" step="any" inputmode="decimal" data-addon-item="${item.id}" placeholder="0" value="${existingItems[item.id]||''}">
        </div>`).join('')}
      </div>
    </div>`).join('');

  app.innerHTML = `
    <header class="H no-print">
      <div class="H-logo">${existing?'Edit Add-On':'Add-On Order'}</div>
      <div class="H-right"><button class="B B-ghost" id="bAddOnCancel">← Cancel</button></div>
    </header>
    <div class="Page" style="padding-top:12px;">
      <div class="Modal-field" style="margin-bottom:16px;">
        <label>Requested by</label>
        <input id="addonName" placeholder="Your name" value="${existing?(existing.requested_by||'').replace(/"/g,'&quot;'):''}">
      </div>
      <div style="font-size:12px;color:#777;margin-bottom:14px;">Only enter quantities for what's actually needed extra this week — leave everything else blank.</div>
      ${rows}
    </div>
    <div class="Footer no-print">
      <button class="Fbtn" id="bAddOnCancel2">Cancel</button>
      <div class="Footer-prog">${weekLbl}</div>
      <button class="Fbtn Fbtn-next" id="bAddOnSubmit">${existing?'Save Changes':'Submit Add-On'}</button>
    </div>`;

  document.getElementById('bAddOnCancel').onclick=document.getElementById('bAddOnCancel2').onclick=onDone;
  document.getElementById('bAddOnSubmit').onclick=async ()=>{
    const name=document.getElementById('addonName').value.trim()||'Unnamed';
    const items={};
    document.querySelectorAll('[data-addon-item]').forEach(inp=>{
      const v=inp.value.trim();
      if(v!=='' && Number(v)>0) items[inp.dataset.addonItem]=v;
    });
    if(Object.keys(items).length===0){ alert('Enter at least one item quantity before submitting.'); return; }
    showLoading();
    const itemsSummary=Object.keys(items).map(k=>{ const it=ITEM_BY_ID[k]; return it?`${it.name} x${items[k]}`:''; }).filter(Boolean).join(', ');
    const {data:mainOrderForLog}=await sb.from(TABLE).select('id').eq('location','darien').eq('week_label',weekLbl).limit(1);
    const logOrderId=mainOrderForLog && mainOrderForLog.length ? mainOrderForLog[0].id : null;
    if(existing){
      await saveSnapshot('darien_addons', existing.id, existing.items||{}, (existing.week_label||'')+' — before edit');
      const delivered=existing.delivered||{};
      const allDone=Object.keys(items).every(k=>Number(delivered[k]||0)>=Number(items[k]||0));
      await sb.from('darien_addons').update({items, requested_by:name, status:allDone?'fulfilled':'open'}).eq('id',existing.id);
      await logActivity(logOrderId, weekLbl, 'addon_edited', `Add-on edited by ${name}: ${itemsSummary}`, name);
    } else {
      await sb.from('darien_addons').insert({week_label:weekLbl, requested_by:name, items, delivered:{}, status:'open'});
      await logActivity(logOrderId, weekLbl, 'addon_submitted', `Add-on submitted by ${name}: ${itemsSummary}`, name);
    }
    onDone();
  };
}

// ─── DELIVERIES (Westmont side) ──────────────────────────────────────────────
// Shows what's still owed — this week's standard Need (minus anything already
// marked delivered) plus every open add-on — with a way to mark quantities
// delivered as they actually go out.
function deliveryRow(item, remaining, deliveredQty, source, recordId){

      <div class="ProdRow-meta">Remaining: ${remaining} ${item.unit}${deliveredQty>0?' · Picked up so far: '+deliveredQty:''}</div>

      <button class="B B-outline" data-deliver="${source}|${recordId}|${item.id}" style="height:40px;font-size:16px;">⬜</button>
    </div>
  </div>`;
}

// ─── DARIEN'S OWN TRACKER (read-only) ────────────────────────────────────────
// Same underlying data as Westmont's Tracker (the delivered field on the
// weekly order + darien_addons), just shown from Darien's side: what did we
// order, and what's actually shown up so far. No inputs — Darien can see it,
// only Westmont can mark things picked up.
// Darien's own "Order Status" tile — this week's order as a real table:
// Item | Ordered | Add-Ons | Total | Picked Up (✓). No on-hand shown here —
// that stays Westmont-only.
async function showDarienOrderStatus(editMode){
  showLoading();
  const curWeek=currentWeekNumber();
  const {data}=await sb.from(TABLE).select('*').eq('location','darien').order('started_at',{ascending:false}).limit(5);
  const order=(data||[]).find(r=>weekNumberForDate(new Date(r.started_at))===curWeek);

  let latestVerification=null;
  if(order){
    const {data:verifs}=await sb.from('darien_verifications').select('*').eq('order_id',order.id).order('verified_at',{ascending:false}).limit(1);
    if(verifs && verifs.length) latestVerification=verifs[0];
  }

  let rows='', weekAddonsGlobal=[];
  if(order){
    const delivered=order.delivered||{};
    const deliveredAt=order.delivered_at||{};
    const {data:weekAddons}=await sb.from('darien_addons').select('*').eq('week_label',order.week_label);
    const addons=weekAddons||[];
    weekAddonsGlobal=addons;
    ALL_ITEMS.forEach(item=>{
      const ordered=Number(order.counts?.[item.id]||0);
      const itemAddons=addons.filter(a=>Number((a.items||{})[item.id]||0)>0);
      const addonQty=itemAddons.reduce((s,a)=>s+Number((a.items||{})[item.id]||0),0);
      const addonDelivered=itemAddons.reduce((s,a)=>s+Number((a.delivered||{})[item.id]||0),0);
      const total=ordered+addonQty;
      if(total<=0 && !editMode) return;
      const pickedUp=Number(delivered[item.id]||0)+addonDelivered;
      const done=pickedUp>=total;
      if(editMode){
        const addonCellContent = itemAddons.length
          ? `<button class="B B-outline" data-addon-detail="${item.id}" style="height:34px;padding:0 8px;font-size:12px;color:#1B6B3A;">${addonQty} (${itemAddons.length}) ✏️</button>`
          : `<button class="B B-outline" data-addon-detail="${item.id}" style="height:34px;padding:0 8px;font-size:12px;color:#999;">+ Add</button>`;
        rows+=`<tr>
          <td style="padding:8px 10px;border-bottom:1px solid #EEE;font-size:12px;font-weight:600;">${item.name}</td>
          <td style="padding:6px 10px;border-bottom:1px solid #EEE;text-align:center;"><input class="SI" type="number" min="0" step="any" inputmode="decimal" data-edit-ordered="${item.id}" value="${ordered}" style="width:64px;height:34px;font-size:13px;"></td>
          <td style="padding:6px 10px;border-bottom:1px solid #EEE;text-align:center;">${addonCellContent}</td>
          <td style="padding:8px 10px;border-bottom:1px solid #EEE;font-size:13px;text-align:center;font-weight:800;" data-total-cell="${item.id}">${total}</td>
          <td style="padding:8px 10px;border-bottom:1px solid #EEE;font-size:15px;text-align:center;">${done?'✅':''}</td>
        </tr>`;
      } else {
        const ts=deliveredAt[item.id]?new Date(deliveredAt[item.id]).toLocaleDateString('en-US',{month:'short',day:'numeric'}):null;
        rows+=`<tr style="${done?'background:#E8F5ED;':''}">
          <td style="padding:8px 10px;border-bottom:1px solid #EEE;font-size:12px;font-weight:600;">${item.name}${ts?`<div style="font-size:9px;color:#1B6B3A;font-weight:600;">Picked up ${ts}</div>`:''}</td>
          <td style="padding:8px 10px;border-bottom:1px solid #EEE;font-size:13px;text-align:center;font-weight:700;">${ordered||'—'}</td>
          <td style="padding:8px 10px;border-bottom:1px solid #EEE;font-size:13px;text-align:center;font-weight:700;color:#1B6B3A;">${addonQty||'—'}</td>
          <td style="padding:8px 10px;border-bottom:1px solid #EEE;font-size:13px;text-align:center;font-weight:800;">${total}</td>
          <td style="padding:8px 10px;border-bottom:1px solid #EEE;font-size:15px;text-align:center;">${done?'✅':''}</td>
        </tr>`;
      }
    });
  }

  app.innerHTML = `
    <header class="H no-print">
      <div class="H-logo">${editMode?'Edit Order':'Order Status'}</div>
      <div class="H-right"><button class="B B-ghost" id="bStatusBack">← ${editMode?'Cancel':'Darien'}</button></div>
    </header>
    <div class="Page" style="padding-top:12px;">
      ${order ? `<div style="font-size:12px;color:#777;margin-bottom:12px;">${order.week_label}</div>` : ''}
      ${editMode ? `<div class="Modal-field" style="margin-bottom:12px;"><label>Your name</label><input id="editorName" placeholder="Your name"></div>` : ''}
      ${order && latestVerification ? `<div style="background:${latestVerification.is_correct?'#E8F5ED':'#FDECEA'};color:${latestVerification.is_correct?'#1B6B3A':'#C8102E'};font-size:12px;font-weight:700;padding:10px 12px;border-radius:8px;margin-bottom:12px;">${latestVerification.is_correct?'✅ Verified correct':'🚨 Missing items reported'} by ${latestVerification.verified_by||'Unnamed'} on ${new Date(latestVerification.verified_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div>` : ''}
      <div class="LocBlock" style="overflow-x:auto;">
        ${order ? `<table style="width:100%;border-collapse:collapse;">
          <thead><tr style="background:#F7F7F7;">
            <th style="padding:8px 10px;font-size:10px;color:#999;text-transform:uppercase;text-align:left;">Item</th>
            <th style="padding:8px 10px;font-size:10px;color:#999;text-transform:uppercase;">Ordered</th>
            <th style="padding:8px 10px;font-size:10px;color:#999;text-transform:uppercase;">Add-Ons</th>
            <th style="padding:8px 10px;font-size:10px;color:#999;text-transform:uppercase;">Total</th>
            <th style="padding:8px 10px;font-size:10px;color:#999;text-transform:uppercase;">✓</th>
          </tr></thead>
          <tbody>${rows || '<tr><td colspan="5" style="padding:20px;text-align:center;color:#999;font-size:13px;">Nothing ordered yet this week.</td></tr>'}</tbody>
        </table>` : '<div style="padding:20px;text-align:center;color:#999;font-size:13px;">No order has been placed yet this week.</div>'}
      </div>
      ${order ? (editMode
        ? '<button class="B B-red" id="bSaveEdit" style="width:100%;justify-content:center;height:48px;margin-top:16px;">💾 Save Order Changes</button>'
        : `<button class="B B-outline" id="bEditOrder" style="width:100%;justify-content:center;height:48px;margin-top:16px;">✏️ Edit / Add-On</button><button class="B ${latestVerification?'B-outline':'B-red'}" id="bVerifyOrder" style="width:100%;justify-content:center;height:48px;margin-top:10px;${latestVerification?'color:#1B6B3A;border-color:#1B6B3A;':''}">${latestVerification?(latestVerification.is_correct?'✅ Verified — Re-check?':'🚨 Missing Reported — Re-check?'):'✅ Verify Order'}</button>`
      ) : ''}
    </div>`;

  document.getElementById('bStatusBack').onclick=()=>{ editMode ? showDarienOrderStatus(false) : showDarienMenu(); };
  if(document.getElementById('bVerifyOrder')) document.getElementById('bVerifyOrder').onclick=()=>showVerifyOrder(order);
  if(document.getElementById('bEditOrder')) document.getElementById('bEditOrder').onclick=()=>showDarienOrderStatus(true);
  document.querySelectorAll('[data-addon-detail]').forEach(btn=>{
    btn.onclick=()=>showAddonDetailEditor(order, btn.dataset.addonDetail, weekAddonsGlobal);
  });
  if(document.getElementById('bSaveEdit')){
    document.getElementById('bSaveEdit').onclick=async ()=>{
      const editorName=document.getElementById('editorName').value.trim()||'Unnamed';
      showLoading();
      const newCounts={...order.counts};
      const orderChanges=[];
      document.querySelectorAll('[data-edit-ordered]').forEach(inp=>{
        const itemId=inp.dataset.editOrdered;
        const newVal=inp.value.trim();
        const oldVal=String(order.counts?.[itemId]||0);
        if(newVal!==oldVal){
          const item=ITEM_BY_ID[itemId];
          orderChanges.push(`${item?item.name:itemId}: ${oldVal}→${newVal}`);
          newCounts[itemId]=newVal;
        }
      });
      if(orderChanges.length){
        await saveSnapshot('prep_counts', order.id, order.counts||{}, order.week_label+' — before inline edit');
        await sb.from(TABLE).update({counts:newCounts, acknowledged:false, acknowledged_at:null}).eq('id',order.id);
        await logActivity(order.id, order.week_label, 'edited', `Edited by ${editorName}: ${orderChanges.map(c=>'Order '+c).join('; ')}`, editorName);
      }
      showDarienOrderStatus(false);
    };
  }
}

      const inp=document.querySelector(`[data-addon-row="${a.id}"]`);

        await saveSnapshot('darien_addons', a.id, a.items||{}, (a.week_label||'')+' — before edit');
        const newItems={...a.items, [itemId]:String(newVal)};
        const delivered=a.delivered||{};
        const allDone=Object.keys(newItems).every(k=>Number(delivered[k]||0)>=Number(newItems[k]||0));
        await sb.from('darien_addons').update({items:newItems, status:allDone?'fulfilled':'open'}).eq('id',a.id);
        changes.push(`${a.requested_by||'Unnamed'}'s add-on: ${oldVal}→${newVal}`);
      }
    }
    const newQty=document.getElementById('newAddonQty').value.trim();
    if(newQty!=='' && Number(newQty)>0){
      await sb.from('darien_addons').insert({week_label:order.week_label, requested_by:name, items:{[itemId]:newQty}, delivered:{}, status:'open'});
      changes.push(`New add-on by ${name}: ${newQty}`);
    }
    if(changes.length){
      await logActivity(order.id, order.week_label, 'addon_edited', `${item.name} add-ons edited by ${name}: ${changes.join('; ')}`, name);
    }
    closeModal();
    showDarienOrderStatus(true);
  };
}

async function showDarienTracker(){
  showLoading();
  const darienPars=await loadPars('darien');
  const {data:latestD}=await sb.from(TABLE).select('*').eq('location','darien').eq('status','completed').order('completed_at',{ascending:false}).limit(1);
  const mainOrder=(latestD && latestD.length)?latestD[0]:null;

    const {data}=await sb.from('darien_addons').select('*').eq('week_label',mainOrder.week_label);
    weekAddons=data||[];
  }

  let rows='';
  const printItems=[];
  if(mainOrder){
    const delivered=mainOrder.delivered||{};
    ALL_ITEMS.forEach(item=>{
      const par=darienPars[item.id];
      if(par==null) return;
      const baseOrder=Number(mainOrder.counts?.[item.id]||0);

        </div>
      </div>`;
    });

  app.innerHTML = `

      <div class="H-logo">Tracker</div>
      <div class="H-right">
        <button class="B B-ghost" id="bDarienTrackerPrint">🖨 Print</button>

      ${mainOrder ? `<div style="font-size:12px;color:#777;margin-bottom:14px;">${mainOrder.week_label}</div>` : ''}
      <div class="LocBlock">${rows || '<div style="padding:20px;text-align:center;color:#999;font-size:13px;">Nothing ordered yet this week.</div>'}</div>
    </div>`;

  document.getElementById('bBackDarienDash').onclick=()=>showDashboard('darien');
  document.getElementById('bDarienTrackerPrint').onclick=()=>printTrackerSheet('DARIEN TRACKER', mainOrder?mainOrder.week_label:'', printItems);
}

      const total=sunOrder+addonQty;

      sunTotal+=sunOrder; addonTotal+=addonQty; grandTotal+=total;
      const mainDelivered=Number(delivered[item.id]||0);
      const pickedUp=mainDelivered+addonDelivered;
      const done=pickedUp>=total;
      printItems.push({item, ordered:total, pickedUp});
      if(done){
        const fmtTs=ts=>ts?new Date(ts).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
        const mainTs = mainDelivered>0 ? fmtTs((mainOrder.delivered_at||{})[item.id]) : '';
        const addonTsNote = weekAddons.map(a=>{
          const q=Number((a.delivered||{})[item.id]||0);
          if(q<=0) return '';
          const ts=fmtTs((a.delivered_at||{})[item.id]);
          return ts?`${a.requested_by||'Unnamed'} ${ts}`:'';
        }).filter(Boolean).join(' · ');
        const dateNote=[mainTs?'Sunday '+mainTs:'', addonTsNote].filter(Boolean).join(' · ');
        pickedUpRows+=`<tr style="background:#E8F5ED;">
          <td style="padding:8px 10px;font-size:12px;font-weight:600;">${item.name}${dateNote?`<div style="font-size:9px;color:#1B6B3A;font-weight:600;">${dateNote}</div>`:''}</td>
          <td style="padding:8px 6px;font-size:12px;text-align:center;color:#999;">${par!=null?par:'—'}</td>
          <td style="padding:8px 6px;font-size:12px;text-align:center;font-weight:700;">${sunOrder||'—'}</td>
          <td style="padding:8px 6px;font-size:12px;text-align:center;font-weight:700;color:#1B6B3A;">${addonQty||'—'}</td>
          <td style="padding:8px 6px;font-size:13px;text-align:center;font-weight:800;">${total}</td>
          <td style="padding:8px 6px;text-align:center;font-size:15px;">✅</td>
        </tr>`;
      } else {
        bodyRows+=`<tr>
          <td style="padding:8px 10px;font-size:12px;font-weight:600;">${item.name}</td>
          <td style="padding:8px 6px;font-size:12px;text-align:center;color:#999;">${par!=null?par:'—'}</td>
          <td style="padding:8px 6px;font-size:12px;text-align:center;font-weight:700;">${sunOrder||'—'}</td>
          <td style="padding:8px 6px;font-size:12px;text-align:center;font-weight:700;color:#1B6B3A;">${addonQty||'—'}</td>
          <td style="padding:8px 6px;font-size:13px;text-align:center;font-weight:800;">${total}</td>
          <td style="padding:8px 6px;text-align:center;"><button class="B B-outline" data-mark-picked="${item.id}" style="height:32px;padding:0 8px;font-size:14px;">⬜</button></td>
        </tr>`;
      }
    });
  }

  const discrepancyBanner = (latestVerification && !latestVerification.is_correct)
    ? `<div style="background:#FDECEA;color:#C8102E;font-size:12px;font-weight:700;padding:10px 12px;border-radius:8px;margin-bottom:12px;">
        🚨 Darien reported missing items on ${new Date(latestVerification.verified_at).toLocaleDateString('en-US',{month:'short',day:'numeric'})}:
        ${Object.keys(latestVerification.missing_items||{}).map(k=>{

        }).filter(Boolean).join(', ')}
      </div>`

      ? `<div style="background:#E8F5ED;color:#1B6B3A;font-size:12px;font-weight:700;padding:10px 12px;border-radius:8px;margin-bottom:12px;">✅ Darien verified this order as correct on ${new Date(latestVerification.verified_at).toLocaleDateString('en-US',{month:'short',day:'numeric'})}${latestVerification.verified_by?' by '+latestVerification.verified_by:''}</div>`
      : '';

  app.innerHTML = `
    <header class="H no-print">
      <div class="H-logo">Active Orders</div>
      <div class="H-right">
        <button class="B B-ghost" id="bActivePrint">🖨 Print</button>
        <button class="B B-ghost" id="bActiveBack">← Orders</button>
      </div>
    </header>
    <div class="Page" style="padding-top:12px;">
      ${mainOrder ? `<div style="font-size:12px;color:#777;margin-bottom:10px;">${mainOrder.week_label}</div>` : ''}
      ${discrepancyBanner}
      <div class="LocBlock" style="overflow-x:auto;margin-bottom:20px;">
        ${mainOrder ? `<table style="width:100%;border-collapse:collapse;">
          <thead><tr style="background:#F7F7F7;">
            <th style="padding:8px 10px;font-size:9px;color:#999;text-transform:uppercase;text-align:left;">Item</th>
            <th style="padding:8px 6px;font-size:9px;color:#999;text-transform:uppercase;">Par</th>
            <th style="padding:8px 6px;font-size:9px;color:#999;text-transform:uppercase;">Sunday</th>
            <th style="padding:8px 6px;font-size:9px;color:#1B6B3A;text-transform:uppercase;">Add-Ons</th>
            <th style="padding:8px 6px;font-size:9px;color:#999;text-transform:uppercase;">Total</th>
            <th style="padding:8px 6px;font-size:9px;color:#999;text-transform:uppercase;">✓</th>
          </tr></thead>
          <tbody>${bodyRows || '<tr><td colspan="6" style="padding:20px;text-align:center;color:#999;font-size:13px;">Nothing outstanding.</td></tr>'}</tbody>
          <tfoot><tr style="background:#F7F7F7;border-top:2px solid #DDD;">
            <td style="padding:8px 10px;font-size:11px;font-weight:700;">TOTAL</td>
            <td></td>
            <td style="padding:8px 6px;font-size:12px;text-align:center;font-weight:800;">${sunTotal}</td>
            <td style="padding:8px 6px;font-size:12px;text-align:center;font-weight:800;color:#1B6B3A;">${addonTotal}</td>
            <td style="padding:8px 6px;font-size:13px;text-align:center;font-weight:800;">${grandTotal}</td>
            <td></td>

        </table>` : '<div style="padding:20px;text-align:center;color:#999;font-size:13px;">No order placed yet this week.</div>'}
      </div>
      ${pickedUpRows ? `<div style="font-size:12px;color:#777;font-weight:700;text-transform:uppercase;margin-bottom:8px;">✅ Picked Up</div>
      <div class="LocBlock" style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;">
          <thead><tr style="background:#F7F7F7;">
            <th style="padding:8px 10px;font-size:9px;color:#999;text-transform:uppercase;text-align:left;">Item</th>
            <th style="padding:8px 6px;font-size:9px;color:#999;text-transform:uppercase;">Par</th>
            <th style="padding:8px 6px;font-size:9px;color:#999;text-transform:uppercase;">Sunday</th>
            <th style="padding:8px 6px;font-size:9px;color:#1B6B3A;text-transform:uppercase;">Add-Ons</th>
            <th style="padding:8px 6px;font-size:9px;color:#999;text-transform:uppercase;">Total</th>

          <tbody>${pickedUpRows}</tbody>

  document.getElementById('bActiveBack').onclick=()=>showOrdersMenu();
  document.getElementById('bActivePrint').onclick=()=>printTrackerSheet('DARIEN ORDER', mainOrder?mainOrder.week_label:'', printItems);
  if(mainOrder){
    document.querySelectorAll('[data-mark-picked]').forEach(btn=>{
      btn.onclick=async ()=>{
        const itemId=btn.dataset.markPicked;
        const sunOrder=Number(mainOrder.counts?.[itemId]||0);
        showModal('Mark picked up?','Confirm the full amount ('+sunOrder+' from Sunday\'s order'+(weekAddons.some(a=>Number((a.items||{})[itemId]||0)>0)?' plus any add-on':'')+') has been picked up.',[
          {l:'Cancel',c:'B-outline',fn:closeModal},
          {l:'Confirm',c:'B-red',fn:async ()=>{
            closeModal();
            showLoading();
            const nowTs=new Date().toISOString();
            const {data:row}=await sb.from(TABLE).select('delivered,delivered_at').eq('id',mainOrder.id).single();
            const delivered={...(row?.delivered||{})};
            const deliveredAt={...(row?.delivered_at||{})};
            delivered[itemId]=sunOrder;
            deliveredAt[itemId]=nowTs;
            await sb.from(TABLE).update({delivered, delivered_at:deliveredAt}).eq('id',mainOrder.id);
            for(const a of weekAddons){
              const q=Number((a.items||{})[itemId]||0);
              if(q>0){
                const {data:arow}=await sb.from('darien_addons').select('items,delivered,delivered_at').eq('id',a.id).single();
                const adel={...(arow?.delivered||{})};
                const adelAt={...(arow?.delivered_at||{})};
                adel[itemId]=q;
                adelAt[itemId]=nowTs;
                const allDone=Object.keys(arow?.items||{}).every(k=>Number(adel[k]||0)>=Number(arow.items[k]||0));
                await sb.from('darien_addons').update({delivered:adel, delivered_at:adelAt, status:allDone?'fulfilled':'open'}).eq('id',a.id);
              }
            }
            const itemName=ITEM_BY_ID[itemId]?.name||itemId;
            await logActivity(mainOrder.id, mainOrder.week_label, 'picked_up', `${itemName} marked picked up by Westmont (${sunOrder+weekAddons.reduce((s,a)=>s+Number((a.items||{})[itemId]||0),0)} total)`);
            showActiveOrdersTable();
          }},
        ]);
      };
    });
  }
}

// ─── PAST ORDERS CALENDAR ────────────────────────────────────────────────────
let calendarMonthOffset=0;
async function showPastOrdersCalendar(){
  showLoading();
  const {data:allOrders}=await sb.from(TABLE).select('id,week_label,status,completed_at').eq('location','darien').eq('status','completed').order('completed_at',{ascending:false}).limit(60);
  const orders=allOrders||[];
  const orderDates={};
  orders.forEach(o=>{
    if(!o.completed_at) return;
    const d=new Date(o.completed_at);
    const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(!orderDates[key]) orderDates[key]=o;
  });

  const now=new Date();
  const viewMonth=new Date(now.getFullYear(), now.getMonth()+calendarMonthOffset, 1);
  const monthLabel=viewMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const firstDay=new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 1);
  const startOffset=(firstDay.getDay()+6)%7;
  const daysInMonth=new Date(viewMonth.getFullYear(), viewMonth.getMonth()+1, 0).getDate();

  let cells='';
  for(let i=0;i<startOffset;i++) cells+='<div></div>';
  for(let day=1; day<=daysInMonth; day++){
    const key=viewMonth.getFullYear()+'-'+String(viewMonth.getMonth()+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const hasOrder=!!orderDates[key];
    cells+=`<div ${hasOrder?`data-cal-day="${key}"`:''} style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:13px;font-weight:${hasOrder?'800':'500'};color:${hasOrder?'#fff':'#333'};background:${hasOrder?'#C8102E':'transparent'};cursor:${hasOrder?'pointer':'default'};">${day}</div>`;
  }

  app.innerHTML = `
    <header class="H no-print">
      <div class="H-logo">Past Orders</div>
      <div class="H-right"><button class="B B-ghost" id="bCalBack">← Orders</button></div>
    </header>
    <div class="Page" style="padding-top:12px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <button class="B B-outline" id="bCalPrev">‹ Prev</button>
        <div style="font-family:'Libre Baskerville',Georgia,serif;font-size:17px;font-weight:700;">${monthLabel}</div>
        <button class="B B-outline" id="bCalNext">Next ›</button>
      </div>
      <div class="LocBlock" style="padding:14px;margin-bottom:16px;">
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px;">
          ${['M','T','W','T','F','S','S'].map(d=>`<div style="text-align:center;font-size:10px;font-weight:700;color:#999;">${d}</div>`).join('')}
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;">${cells}</div>
      </div>
      <button class="B B-outline" id="bHistoricalData" style="width:100%;justify-content:center;height:48px;">📊 Historical Data</button>
    </div>`;

  document.getElementById('bCalBack').onclick=()=>{ calendarMonthOffset=0; showOrdersMenu(); };
  document.getElementById('bCalPrev').onclick=()=>{ calendarMonthOffset--; showPastOrdersCalendar(); };
  document.getElementById('bCalNext').onclick=()=>{ calendarMonthOffset++; showPastOrdersCalendar(); };
  document.getElementById('bHistoricalData').onclick=()=>showHistoricalData();
  Object.keys(orderDates).forEach(key=>{
    const el=document.querySelector(`[data-cal-day="${key}"]`);
    if(el) el.onclick=()=>showOrderDetail(orderDates[key], ()=>showPastOrdersCalendar(), orderDates[key].week_label);
  });
}

// ─── HISTORICAL DATA (weekly/monthly averages, all-item totals) ─────────────
async function showHistoricalData(){
  showLoading();
  const {data:allOrders}=await sb.from(TABLE).select('*').eq('location','darien').eq('status','completed').order('completed_at',{ascending:false}).limit(52);
  const orders=allOrders||[];

  const weeklyAvg={}, monthlyBuckets={};
  ALL_ITEMS.forEach(item=>{
    const vals=orders.slice(0,6).map(o=>Number(o.counts?.[item.id]||0));
    weeklyAvg[item.id]=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
  });
  orders.forEach(o=>{
    if(!o.completed_at) return;
    const d=new Date(o.completed_at);
    const mKey=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    if(!monthlyBuckets[mKey]) monthlyBuckets[mKey]=[];
    monthlyBuckets[mKey].push(o);
  });
  const mostRecentMonthKey=Object.keys(monthlyBuckets).sort().reverse()[0];
  const monthlyOrders=mostRecentMonthKey?monthlyBuckets[mostRecentMonthKey]:[];
  const monthlyAvg={};
  ALL_ITEMS.forEach(item=>{
    const vals=monthlyOrders.map(o=>Number(o.counts?.[item.id]||0));
    monthlyAvg[item.id]=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
  });

  let grandTotalAllItems=0;
  const rows=ALL_ITEMS.map(item=>{
    const wk=weeklyAvg[item.id], mo=monthlyAvg[item.id];
    if(wk<=0 && mo<=0) return '';
    grandTotalAllItems+=wk;
    return `<tr>
      <td style="padding:8px 10px;font-size:12px;font-weight:600;">${item.name}</td>
      <td style="padding:8px 6px;font-size:12px;text-align:center;font-weight:700;color:#C8102E;">${wk.toFixed(1)}</td>
      <td style="padding:8px 6px;font-size:12px;text-align:center;font-weight:700;color:#1B6B3A;">${mo.toFixed(1)}</td>
    </tr>`;
  }).join('');

  app.innerHTML = `
    <header class="H no-print">
      <div class="H-logo">Historical Data</div>
      <div class="H-right"><button class="B B-ghost" id="bHistBack">← Past Orders</button></div>
    </header>
    <div class="Page" style="padding-top:12px;">
      <div style="font-size:12px;color:#777;margin-bottom:14px;">Weekly avg = last 6 weeks · Monthly avg = ${mostRecentMonthKey?new Date(mostRecentMonthKey+'-01').toLocaleDateString('en-US',{month:'long',year:'numeric'}):'—'}</div>
      <div class="LocBlock" style="overflow-x:auto;margin-bottom:16px;">
        <table style="width:100%;border-collapse:collapse;">
          <thead><tr style="background:#F7F7F7;">
            <th style="padding:8px 10px;font-size:9px;color:#999;text-transform:uppercase;text-align:left;">Item</th>
            <th style="padding:8px 6px;font-size:9px;color:#999;text-transform:uppercase;">Weekly Avg</th>
            <th style="padding:8px 6px;font-size:9px;color:#999;text-transform:uppercase;">Monthly Avg</th>
          </tr></thead>
          <tbody>${rows || '<tr><td colspan="3" style="padding:20px;text-align:center;color:#999;font-size:13px;">No order history yet.</td></tr>'}</tbody>
        </table>
      </div>
      <div class="LocBlock" style="padding:14px 16px;">
        <div style="font-size:11px;color:#999;text-transform:uppercase;font-weight:700;">Total Of All Items (weekly avg)</div>
        <div style="font-size:22px;font-weight:800;color:#C8102E;">${grandTotalAllItems.toFixed(1)}</div>
      </div>
      <div style="font-size:11px;color:#999;margin-top:14px;text-align:center;">Yearly averages will appear here once a full year of data is logged.</div>
    </div>`;

  document.getElementById('bHistBack').onclick=()=>showPastOrdersCalendar();
}

async function showDeliveries(){
  showLoading();
  const darienPars=await loadPars('darien');
  const {data:latestD}=await sb.from(TABLE).select('*').eq('location','darien').eq('status','completed').order('completed_at',{ascending:false}).limit(1);
  const mainOrder=(latestD && latestD.length)?latestD[0]:null;
  const allOpenAddons=await getOpenAddons();
  const {data:allFulfilledAddons}=await sb.from('darien_addons').select('*').eq('status','fulfilled').order('created_at',{ascending:false}).limit(30);
  // Only add-ons tied to THIS week's order — not old weeks' history
  const openAddons = mainOrder ? allOpenAddons.filter(a=>a.week_label===mainOrder.week_label) : [];
  const fulfilledAddons = mainOrder ? (allFulfilledAddons||[]).filter(a=>a.week_label===mainOrder.week_label) : [];

  let mainRows='';
  const deliveredLog=[];
  if(mainOrder){
    const delivered=mainOrder.delivered||{};
    ALL_ITEMS.forEach(item=>{
      const par=darienPars[item.id];
      if(par==null) return;
      const need=Number(mainOrder.counts?.[item.id]||0);
      const deliveredQty=Number(delivered[item.id]||0);
      if(deliveredQty>0) deliveredLog.push({item, qty:deliveredQty, source:'Weekly Order', date:mainOrder.completed_at, recordType:'main', recordId:mainOrder.id});
      if(need<=0) return;
      const remaining=Math.max(need-deliveredQty,0);
      if(remaining<=0) return;
      mainRows+=deliveryRow(item,remaining,deliveredQty,'main',mainOrder.id);
    });
  }

  const addonBlocks=openAddons.map(a=>{
    const items=a.items||{};
    const delivered=a.delivered||{};
    const rows=Object.keys(items).map(itemId=>{
      const item=ITEM_BY_ID[itemId];
      if(!item) return '';
      const reqQty=Number(items[itemId]||0);
      const deliveredQty=Number(delivered[itemId]||0);
      if(deliveredQty>0) deliveredLog.push({item, qty:deliveredQty, source:'Add-On · '+(a.requested_by||'Unnamed'), date:a.created_at, recordType:'addon', recordId:a.id});
      const remaining=Math.max(reqQty-deliveredQty,0);
      if(remaining<=0) return '';
      return deliveryRow(item,remaining,deliveredQty,'addon',a.id);
    }).join('');
    const dateStr=new Date(a.created_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
    return `<div class="LocBlock" style="margin-bottom:16px;">
      <div style="padding:12px 16px;border-bottom:1px solid #F0F0F0;">
        <div class="LocHeader-name">Add-On · ${a.requested_by||'Unnamed'}</div>
        <div class="LocHeader-meta">Requested ${dateStr}</div>
      </div>
      ${rows || '<div style="padding:12px 16px;font-size:12px;color:#1B6B3A;">✓ Fully picked up</div>'}
    </div>`;
  }).join('');

  // fulfilled add-ons don't show in the "open" list above, but their
  // deliveries still belong in the permanent log
  (fulfilledAddons||[]).forEach(a=>{
    const items=a.items||{}, delivered=a.delivered||{};
    Object.keys(items).forEach(itemId=>{
      const item=ITEM_BY_ID[itemId];
      if(!item) return;
      const qty=Number(delivered[itemId]||0);
      if(qty>0) deliveredLog.push({item, qty, source:'Add-On · '+(a.requested_by||'Unnamed'), date:a.created_at, recordType:'addon', recordId:a.id});
    });
  });

  deliveredLog.sort((a,b)=>new Date(b.date)-new Date(a.date));
  const deliveredRows = deliveredLog.map(d=>`<div class="ProdRow">
    <div class="ProdRow-info">
      <div class="ProdRow-name">${d.item.name}</div>
      <div class="ProdRow-meta">${d.source} · ${new Date(d.date).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="font-size:15px;font-weight:800;color:#1B6B3A;">✅ ${d.qty} ${d.item.containerLabel==='each'?'each':d.item.containerLabel+(d.qty!==1?'s':'')}</div>
      <button class="B B-outline" data-undo="${d.recordType}|${d.recordId}|${d.item.id}" style="height:28px;padding:0 10px;font-size:11px;">↩️ Undo</button>
    </div>
  </div>`).join('');

  // build a flat item list (ordered + picked up) for the printable sheet
  const printItems=[];
  if(mainOrder){
    const delivered=mainOrder.delivered||{};
    ALL_ITEMS.forEach(item=>{
      const par=darienPars[item.id];
      if(par==null) return;
      const baseOrder=Number(mainOrder.counts?.[item.id]||0);
      let addonQty=0, addonDelivered=0;
      [...openAddons,...(fulfilledAddons||[])].forEach(a=>{
        addonQty+=Number((a.items||{})[item.id]||0);
        addonDelivered+=Number((a.delivered||{})[item.id]||0);
      });
      const ordered=baseOrder+addonQty;
      if(ordered<=0) return;
      const pickedUp=Number(delivered[item.id]||0)+addonDelivered;
      printItems.push({item, ordered, pickedUp});
    });
  }

  app.innerHTML = `
    <header class="H no-print">
      <div class="H-logo">Tracker</div>
      <div class="H-right">
        <button class="B B-ghost" id="bTrackerPrint">🖨 Print</button>
        <button class="B B-ghost" id="bBackDash">← Westmont</button>
      </div>
    </header>
    <div class="Page" style="padding-top:12px;">
      <div style="font-size:12px;color:#777;font-weight:700;text-transform:uppercase;margin-bottom:8px;">This Week's Order</div>
      <div class="LocBlock" style="margin-bottom:20px;">${mainRows || '<div style="padding:16px;text-align:center;color:#999;font-size:13px;">Nothing outstanding.</div>'}</div>
      ${openAddons.length ? '<div style="font-size:12px;color:#777;font-weight:700;text-transform:uppercase;margin-bottom:8px;">Add-On Requests</div>'+addonBlocks : ''}
      ${deliveredLog.length ? '<div style="font-size:12px;color:#777;font-weight:700;text-transform:uppercase;margin-bottom:8px;margin-top:8px;">✅ Picked Up</div><div class="LocBlock">'+deliveredRows+'</div>' : ''}
    </div>`;

  document.getElementById('bBackDash').onclick=()=>showWestmontMenu();
  document.getElementById('bTrackerPrint').onclick=()=>printTrackerSheet('WESTMONT TRACKER', mainOrder?mainOrder.week_label:'', printItems);
  document.querySelectorAll('[data-undo]').forEach(btn=>{
    btn.onclick=async ()=>{
      const [source,recordId,itemId]=btn.dataset.undo.split('|');
      if(source==='main'){
        const {data:row}=await sb.from(TABLE).select('delivered').eq('id',recordId).single();
        const delivered={...(row?.delivered||{})};
        delivered[itemId]=0;
        await sb.from(TABLE).update({delivered}).eq('id',recordId);
      } else {
        const {data:row}=await sb.from('darien_addons').select('delivered').eq('id',recordId).single();
        const delivered={...(row?.delivered||{})};
        delivered[itemId]=0;
        await sb.from('darien_addons').update({delivered, status:'open'}).eq('id',recordId);
      }
      showDeliveries();
    };
  });
  document.querySelectorAll('[data-deliver]').forEach(btn=>{
    btn.onclick=async ()=>{
      const [source,recordId,itemId]=btn.dataset.deliver.split('|');
      const input=document.querySelector(`[data-deliver-input="${source}|${recordId}|${itemId}"]`);
      const amt=Number(input.value||0);
      if(amt<=0) return;
      if(source==='main'){
        const {data:row}=await sb.from(TABLE).select('delivered').eq('id',recordId).single();
        const delivered={...(row?.delivered||{})};
        delivered[itemId]=Number(delivered[itemId]||0)+amt;
        await sb.from(TABLE).update({delivered}).eq('id',recordId);
      } else {
        const {data:row}=await sb.from('darien_addons').select('items,delivered').eq('id',recordId).single();
        const delivered={...(row?.delivered||{})};
        delivered[itemId]=Number(delivered[itemId]||0)+amt;
        const items=row?.items||{};
        const allDone=Object.keys(items).every(k=>Number(delivered[k]||0)>=Number(items[k]||0));
        await sb.from('darien_addons').update({delivered, status:allDone?'fulfilled':'open'}).eq('id',recordId);
      }
      showDeliveries();
    };
  });
}

async function saveNote(noteText, location, orderId){
  if(testMode) return;
  try{
    await sb.from('prep_notes').insert({location, order_id:orderId||null, note:noteText, created_by:session?.counter_name||''});
    loadNotes(orderId);
  }catch(e){
    showModal('Error','Could not save the note — check your connection and try again.',[{l:'OK',c:'B-red',fn:closeModal}]);

}

async function loadNotes(orderId){
  const listEl=document.getElementById('noteList');
  if(!listEl) return;
  let query=sb.from('prep_notes').select('*').eq('location',activeLoc);
  query = orderId ? query.eq('order_id',orderId) : query.is('order_id',null);
  const {data:notes,error}=await query.order('created_at',{ascending:false}).limit(100);
  if(error){ listEl.innerHTML=`<div style="padding:16px;color:#C8102E;font-size:13px;">Could not load notes — check your connection.</div>`; return; }
  if(!notes || !notes.length){ listEl.innerHTML=`<div style="padding:16px;color:#777;font-size:13px;">No notes yet.</div>`; return; }
  listEl.innerHTML=notes.map(n=>`

      </div>
    </div>`).join('');
