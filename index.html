  <title>Zazzo's Big Prep</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{background:#EFEFEF;color:#111;font-family:'Inter',system-ui,sans-serif;font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased;}

    .H{position:fixed;top:0;left:0;right:0;height:60px;background:#C8102E;border-bottom:4px solid #1B6B3A;display:flex;align-items:center;padding:0 16px;gap:10px;z-index:200;}
    .H-logo{font-family:'Libre Baskerville',Georgia,serif;font-size:20px;font-weight:700;color:#fff;letter-spacing:0.04em;}
    .H-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
    .B{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 14px;border-radius:6px;font-family:'Inter',system-ui,sans-serif;font-size:12px;font-weight:700;cursor:pointer;border:2px solid transparent;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
    .B:active{opacity:0.75;}
    .B-ghost{background:transparent;border-color:rgba(255,255,255,0.5);color:#fff;}
    .B-outline{background:#fff;border-color:#E2E2E2;color:#111;}
    .B-red{background:#C8102E;border-color:#C8102E;color:#fff;}
    .B-lg{height:44px;padding:0 20px;font-size:14px;}

    /* LOGIN / HOME */
    .Login{min-height:100vh;background:#EFEFEF;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:36px;}
    .Login-logo{font-family:'Libre Baskerville',Georgia,serif;font-size:48px;font-weight:700;color:#C8102E;line-height:1;text-align:center;}
    .Login-tag{margin-top:10px;font-size:11px;font-weight:700;color:#777;letter-spacing:0.2em;text-transform:uppercase;text-align:center;}
    .Login-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:420px;}
    .LCard{background:#fff;border:2px solid #1B6B3A;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.07);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px 12px;min-height:130px;transition:border-color 0.15s,box-shadow 0.15s,transform 0.15s;user-select:none;-webkit-tap-highlight-color:transparent;text-align:center;}
    .LCard:active{transform:translateY(1px);}
    .LCard-emoji{font-size:28px;}
    .LCard-role{font-family:'Libre Baskerville',Georgia,serif;font-size:17px;font-weight:700;color:#111;}
    .LCard-sub{font-size:11px;font-weight:600;font-style:italic;color:#C8102E;}
    .LCard-status{font-size:10px;font-weight:700;color:#1B6B3A;margin-top:2px;}
    .LCard-status.active{color:#C8102E;}

    /* PAGE */
    .Page{margin-top:64px;padding:12px 16px 100px;}

    /* ACCORDION */
    .LocBlock{border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08),0 0 0 1px rgba(0,0,0,0.04);margin-bottom:10px;background:#fff;}
    .LocHeader{display:flex;align-items:center;padding:13px 16px;gap:12px;user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer;}
    .LocHeader-arrow{font-size:18px;flex-shrink:0;transition:transform 0.2s;color:#C8102E;font-weight:700;}
    .LocHeader-arrow.open{transform:rotate(90deg);}
    .LocHeader-info{flex:1;min-width:0;}
    .LocHeader-name{font-family:'Libre Baskerville',Georgia,serif;font-size:15px;font-weight:700;color:#111;}
    .LocHeader-meta{font-size:11px;color:#777;margin-top:2px;}
    .LocHeader-badge{flex-shrink:0;font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;}
    .badge-done{background:#E8F5ED;color:#1B6B3A;}
    .badge-active{background:#FDECEA;color:#C8102E;}

    .LocBody{display:none;border-top:1px solid #F0F0F0;}
    .LocBody.open{display:block;}

    /* ITEMS */
    .ProdRow{display:flex;align-items:center;padding:9px 16px;border-bottom:1px solid #F5F5F5;gap:10px;}
    .ProdRow:last-child{border-bottom:none;}
    .ProdRow-info{flex:1;min-width:0;}
    .ProdRow-name{font-size:13px;font-weight:600;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .ProdRow-meta{font-size:11px;color:#777;margin-top:1px;}
    .ProdRow-total{color:#1B6B3A;font-weight:700;}

    .DualInput{display:flex;gap:5px;flex-shrink:0;}
    .IG{display:flex;flex-direction:column;align-items:center;gap:2px;}
    .IG label{font-size:9px;font-weight:700;color:#777;text-transform:uppercase;letter-spacing:0.06em;}
    .SI{width:54px;height:40px;border:2px solid #E2E2E2;border-radius:6px;background:#fff;color:#111;font-family:'Inter',system-ui,sans-serif;font-size:15px;font-weight:700;text-align:center;padding:0;-webkit-appearance:none;appearance:none;}
    .SI:focus{outline:none;border-color:#C8102E;}
    .SI::-webkit-inner-spin-button,.SI::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
    .SI.filled{background:#fff8f9;color:#C8102E;}
    .SI-readonly{width:54px;height:40px;border:2px dashed #1B6B3A;border-radius:6px;background:#F0F7F2;color:#1B6B3A;font-family:'Inter',system-ui,sans-serif;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;}

    /* FOOTER */
    .Footer{position:fixed;bottom:0;left:0;right:0;height:60px;background:#C8102E;border-top:4px solid #1B6B3A;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:150;}
    .Footer-prog{font-size:12px;font-weight:700;color:rgba(255,255,255,0.9);text-align:center;flex:1;padding:0 8px;}
    .Fbtn{height:38px;padding:0 16px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid rgba(255,255,255,0.5);background:transparent;color:#fff;white-space:nowrap;-webkit-tap-highlight-color:transparent;font-family:'Inter',system-ui,sans-serif;}
    .Fbtn:active{background:rgba(255,255,255,0.15);}
    .Fbtn-next{background:#fff;color:#C8102E;border-color:#fff;}

    /* OVERLAY */
    .Overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px;}
    .Modal{background:#fff;border-radius:12px;padding:26px;max-width:400px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,0.22);}
    .Modal-title{font-family:'Libre Baskerville',Georgia,serif;font-size:18px;font-weight:700;color:#111;margin-bottom:8px;}
    .Modal-body{font-size:14px;color:#444;line-height:1.65;margin-bottom:18px;}
    .Modal-actions{display:flex;gap:10px;justify-content:flex-end;}
    .Modal-field{margin-bottom:14px;}
    .Modal-field label{display:block;font-size:11px;font-weight:700;color:#777;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;}
    .Modal-field input{width:100%;height:40px;border:2px solid #E2E2E2;border-radius:8px;padding:0 12px;font-family:'Inter',system-ui,sans-serif;font-size:14px;color:#111;}
    .Modal-field input:focus{outline:none;border-color:#C8102E;}
    .AvgRow{display:flex;font-size:13px;padding:5px 0;border-bottom:1px solid #F5F5F5;}
    .AvgRow:last-child{border-bottom:none;}
    .AvgRow-name{flex:1;color:#444;}
    .AvgRow-val{font-weight:700;color:#C8102E;font-family:'Inter',system-ui,sans-serif;}

    .Loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#999;font-size:13px;}

    /* PRINT */
    .print-show{display:none;}
    @media print{
      *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
      @page{margin:0.5in;size:letter portrait;}
      body > *{display:none!important;}
      #print-area{display:block!important;}
    }
  </style>
</head>

// ─── WEEK NUMBERING ──────────────────────────────────────────────────────────
// Week 1 = the Monday–Sunday of our first real data (Jul 6–12, 2026).
// Both locations share this same numbering so "Week 3" means the same
// calendar week on both sides, even if one side has no data for it yet.
const WEEK1_MONDAY = new Date('2026-07-06T00:00:00Z');
const MS_PER_WEEK = 7*24*60*60*1000;
function weekNumberForDate(d){
  return Math.floor((d.getTime()-WEEK1_MONDAY.getTime())/MS_PER_WEEK)+1;
}
function weekRangeLabel(n){
  const mon=new Date(WEEK1_MONDAY.getTime()+(n-1)*MS_PER_WEEK);
  const sun=new Date(mon.getTime()+6*24*60*60*1000);
  const fmt=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  return fmt(mon)+' – '+fmt(sun);
}
function currentWeekNumber(){ return weekNumberForDate(new Date()); }

// What Westmont currently owes Darien, per item, in CONTAINER units (bags/
// buckets/etc — same units Westmont counts in). = (this week's standard
// Need, minus anything already marked delivered) + (any open add-on amounts,
// minus anything delivered against those). Uses only the single most recent
// Darien weekly order — older ones are just history. Used by both the
// Dashboard and the live Count screen so the numbers always match.
async function getDarienOwedMap(){
  if(testMode) return {};
  const owed={};
  const {data:latestD}=await sb.from(TABLE).select('*').eq('location','darien').eq('status','completed').order('completed_at',{ascending:false}).limit(1);
  if(latestD && latestD.length){
    const darienPars=await loadPars('darien');
    const mainDelivered=latestD[0].delivered||{};
    ALL_ITEMS.forEach(item=>{
      const par=darienPars[item.id];
      if(par==null) return;
      const onHand=Number(latestD[0].counts?.[item.id]||0);
      const need=Math.max(par-onHand,0);
      const delivered=Number(mainDelivered[item.id]||0);
      owed[item.id]=Math.max(need-delivered,0);
    });
  }
  const openAddons=await getOpenAddons();
  openAddons.forEach(a=>{
    const items=a.items||{}, delivered=a.delivered||{};
    Object.keys(items).forEach(itemId=>{
      const requested=Number(items[itemId]||0);
      const del=Number(delivered[itemId]||0);
      const remaining=Math.max(requested-del,0);
      if(remaining>0) owed[itemId]=(owed[itemId]||0)+remaining;
    });
  });
  return owed;
}


function defaultWeekLabel(){
  const d=new Date(); const day=d.getDay();
  const monday=new Date(d); monday.setDate(d.getDate()-((day+6)%7));
  return 'Week of '+monday.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function mondayOf(d){
  const day=d.getDay();
  const diff=(day+6)%7; // days since Monday (Mon=0 ... Sun=6)
  const mon=new Date(d);
  mon.setHours(0,0,0,0);
  mon.setDate(mon.getDate()-diff);
  return mon;
}
// Darien-specific: a Sunday order is for the week that starts the NEXT day
// (weeks run Mon–Sun, so Sunday is the last day of the week it falls in —
// but an order placed on Sunday is for the upcoming week, not that one).
// Anything picked Mon–Sat just falls in its own normal Mon–Sun week.
function targetMondayForDarienOrder(picked){
  if(picked.getDay()===0){
    const nextMon=new Date(picked);
    nextMon.setHours(0,0,0,0);
    nextMon.setDate(nextMon.getDate()+1);
    return nextMon;
  }
  return mondayOf(picked);
}
function mostRecentSunday(d){
  const sun=new Date(d);
  sun.setHours(0,0,0,0);
  sun.setDate(sun.getDate()-sun.getDay());
  return sun;
}

function catFilledCount(cat){ return cat.items.filter(i=>(session.counts[i.id]??'')!=='' ).length; }
function catComplete(cat){ return cat.items.every(i=>(session.counts[i.id]??'')!=='' ); }
function totalItems(){ return ALL_ITEMS.length; }
function totalCounted(){ return ALL_ITEMS.filter(i=>(session.counts[i.id]??'')!=='' ).length; }
function allComplete(){ return CATEGORIES.every(catComplete); }

// ─── DASHBOARD ───────────────────────────────────────────────────────────────
async function showDashboard(lk){
  activeLoc=lk;
  showLoading();
  const l=LOCATIONS[lk];
  let sessions=[];
  if(testMode){
    if(testSessions[lk]) sessions=[testSessions[lk]];
  } else {
    const {data,error}=await sb.from(TABLE).select('*').eq('location',lk).order('started_at',{ascending:true});
    if(!error) sessions=data||[];
  }
  const pars = await loadPars(lk);
  const pendingDarien = lk==='westmont' ? await getPendingDarienOrders() : [];
  const openAddons = await getOpenAddons();

  // What Westmont currently owes Darien — shared logic, also used on the
  // actual Count screen so the subtraction shows up while you're typing,
  // not just afterward on the dashboard.
  const darienNeedMap = (lk==='westmont') ? await getDarienOwedMap() : {};

  const curWeek=currentWeekNumber();
  if(selectedWeek==null || selectedWeek>curWeek) selectedWeek=curWeek;

  const weekMap={};
  sessions.forEach(s=>{
    const dateStr=s.completed_at||s.started_at;
    const wk=weekNumberForDate(new Date(dateStr));
    const existing=weekMap[wk];
    if(!existing) weekMap[wk]=s;
    else {
      const existingDate=new Date(existing.completed_at||existing.started_at);
      const thisDate=new Date(dateStr);
      const thisBetter = (s.status==='completed' && existing.status!=='completed') || thisDate>existingDate;
      if(thisBetter) weekMap[wk]=s;
    }
  });

  const completedSessions=sessions.filter(s=>s.status==='completed').sort((a,b)=>new Date(b.completed_at)-new Date(a.completed_at)).slice(0,6);
  const averages={};
  ALL_ITEMS.forEach(item=>{
    if(completedSessions.length===0){ averages[item.id]=null; return; }
    const vals=completedSessions.map(s=>Number(s.counts?.[item.id]||0));
    averages[item.id]=vals.reduce((a,b)=>a+b,0)/vals.length;
  });

  const maxDataWeek = sessions.length ? Math.max(...sessions.map(s=>weekNumberForDate(new Date(s.completed_at||s.started_at)))) : curWeek;
  const lastTab = Math.max(curWeek+1, maxDataWeek); // always show at least one week ahead
  const weekTabs=[];
  for(let w=1; w<=lastTab; w++) weekTabs.push(w);

  const activeSession=weekMap[selectedWeek];

  const rows = ALL_ITEMS.map(item=>{
    const countVal = activeSession ? (activeSession.counts?.[item.id] ?? '') : '';
    const countTxt = countVal!=='' ? countVal+' '+item.unit.replace(/^\d+[\s-]*/,'').split(' ')[0] : '—';
    const avgTxt = averages[item.id]!=null ? averages[item.id].toFixed(1) : '—';
    const parTxt = pars[item.id]!=null ? pars[item.id] : '—';
    const inProgTag = activeSession && activeSession.status==='in_progress' ? ' <span style="color:#C8102E;font-weight:700;">(in progress)</span>' : '';

    let darienLine='';
    if(lk==='westmont' && selectedWeek===curWeek){
      const need=darienNeedMap[item.id];
      if(need!=null && need>0){
        const needBase=need*item.mult;
        if(countVal!==''){
          const trueCount=Number(countVal)*item.mult-needBase;
          darienLine=`<div style="font-size:11px;margin-top:4px;font-weight:700;color:${trueCount<0?'#C8102E':'#1B6B3A'};">🚚 ${needBase} ${item.baseUnit} to Darien · True count: ${trueCount} ${item.baseUnit}</div>`;
        } else {
          darienLine=`<div style="font-size:11px;margin-top:4px;color:#999;">🚚 Darien needs ${needBase} ${item.baseUnit} — no Westmont count yet this week</div>`;
        }
      }
    }

    return `<div class="ProdRow">
      <div class="ProdRow-info">
        <div class="ProdRow-name">${item.name}</div>
        <div class="ProdRow-meta">${item.unit}</div>
        ${darienLine}
      </div>
      <div style="display:flex;gap:14px;text-align:center;flex-shrink:0;">
        <div style="width:44px;"><div style="font-size:9px;color:#999;text-transform:uppercase;font-weight:700;">Par</div><div style="font-size:13px;color:${pars[item.id]!=null?'#111':'#ccc'};font-weight:${pars[item.id]!=null?'700':'400'};">${parTxt}</div></div>
        <div style="width:54px;"><div style="font-size:9px;color:#999;text-transform:uppercase;font-weight:700;">Count</div><div style="font-size:13px;font-weight:700;color:#111;">${countTxt}${inProgTag}</div></div>
        <div style="width:44px;"><div style="font-size:9px;color:#999;text-transform:uppercase;font-weight:700;">Avg</div><div style="font-size:13px;font-weight:700;color:#C8102E;">${avgTxt}</div></div>
      </div>
    </div>`;
  }).join('');

  app.innerHTML = `
    <header class="H no-print">
      <div class="H-logo">${l.name}</div>
      <div class="H-right">
        ${lk==='westmont' && !testMode ? `<button class="B ${openAddons.length?'B-red':'B-ghost'}" id="bDeliveries">🚚 Deliveries${openAddons.length?' ('+openAddons.length+')':''}</button>` : ''}
        ${lk==='westmont' ? `<button class="B ${pendingDarien.length?'B-red':'B-ghost'}" id="bDarienOrders">📦 Darien${pendingDarien.length?' ('+pendingDarien.length+')':''}</button>` : ''}
        <button class="B B-ghost" id="bDashHome">🏠 Home</button>
      </div>
    </header>
    <div class="Page" style="padding-top:12px;">
      ${testMode?'<div style="background:#FDECEA;color:#C8102E;font-size:12px;font-weight:700;padding:8px 12px;border-radius:8px;margin-bottom:10px;text-align:center;">🧪 TEST MODE — showing test data only</div>':''}
      ${lk==='westmont' && pendingDarien.length ? `<div style="background:#FDECEA;color:#C8102E;font-size:12px;font-weight:700;padding:10px 12px;border-radius:8px;margin-bottom:10px;text-align:center;">🔔 Darien has ${pendingDarien.length} order${pendingDarien.length!==1?'s':''} awaiting review — tap 📦 Darien above</div>` : ''}
      ${lk==='darien' && openAddons.length ? openAddons.map(a=>{
        const itemLines=Object.keys(a.items||{}).map(id=>{
          const it=ITEM_BY_ID[id]; if(!it) return '';
          const req=Number(a.items[id]||0), del=Number((a.delivered||{})[id]||0), rem=Math.max(req-del,0);
          return `<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0;"><span>${it.name}</span><span style="font-weight:700;color:${rem>0?'#8A6300':'#1B6B3A'};">${rem>0?rem+' still owed':'✓ delivered'}</span></div>`;
        }).join('');
        const dateStr=new Date(a.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'});
        return `<div style="background:#FFF6E0;border-radius:8px;padding:10px 14px;margin-bottom:10px;">
          <div style="font-size:12px;font-weight:700;color:#8A6300;margin-bottom:4px;">📬 Add-on from ${dateStr} — requested by ${a.requested_by||'Unnamed'}</div>
          ${itemLines}
        </div>`;
      }).join('') : ''}
      <button class="B B-outline" id="bPrintCenter" style="width:100%;justify-content:center;margin-bottom:12px;">🖨 Print</button>
      <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;">
        ${weekTabs.map(w=>`<button class="B ${w===selectedWeek?'B-red':'B-outline'}" data-week="${w}" style="flex-shrink:0;">Week ${w}</button>`).join('')}
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <div style="font-size:12px;color:#777;font-weight:600;">${weekRangeLabel(selectedWeek)}${selectedWeek===curWeek?' · current week':''}</div>
        ${activeSession && activeSession.status==='completed' ? '<div style="display:flex;gap:6px;"><button class="B B-outline" id="bDashEdit" style="height:28px;padding:0 10px;font-size:11px;">✏️ Edit</button><button class="B B-outline" id="bDashPrint" style="height:28px;padding:0 10px;font-size:11px;">🖨 Print</button></div>' : ''}
      </div>
      <div class="LocBlock">${rows}</div>
    </div>
    <div class="Footer no-print">
      <button class="Fbtn" id="bDashHome2">🏠 Home</button>
      ${lk==='darien' && !testMode ? `<button class="Fbtn" id="bAddOn">📬 Add-On</button>` : `<div class="Footer-prog">${l.name} Dashboard</div>`}
      <button class="Fbtn Fbtn-next" id="bDashAction">${l.actionLabel}</button>
    </div>`;

  document.getElementById('bDashHome').onclick=document.getElementById('bDashHome2').onclick=()=>showHome();
  document.getElementById('bDashAction').onclick=()=>goToCounting(lk);
  if(document.getElementById('bAddOn')) document.getElementById('bAddOn').onclick=()=>showAddOnForm();
  if(document.getElementById('bDeliveries')) document.getElementById('bDeliveries').onclick=()=>showDeliveries();

      if(lk==='darien') currentPars=await loadPars('darien');

  if(document.getElementById('bDashEdit')){
    document.getElementById('bDashEdit').onclick=()=>{
      showModal('Edit '+activeSession.week_label+'?','This reopens the completed numbers so you can fix them. Once you finish it again, it overrides this week\'s order/count and — for Darien — has to be re-certified and re-acknowledged by Westmont, just like a new submission.',[

  if(lk==='westmont'){

      showModal('Edit '+o.week_label+'?','This reopens the completed numbers so you can fix them. Once it\'s finished again, it overrides this order and has to be re-certified and re-acknowledged, just like a new submission.',[
        {l:'Cancel',c:'B-outline',fn:closeModal},
        {l:'Edit',c:'B-red',fn:async ()=>{ closeModal(); await editCompletedOrder(o); }},
      ]);
    };
    const ackBtn=document.querySelector(`[data-ack="${o.id}"]`);
    if(ackBtn) ackBtn.onclick=async ()=>{
      await sb.from(TABLE).update({acknowledged:true, acknowledged_at:new Date().toISOString()}).eq('id',o.id);
      showDarienOrders();
    };
  });
}

// ─── DELIVERIES (Westmont side) ──────────────────────────────────────────────
// Shows what's still owed — this week's standard Need (minus anything already
// marked delivered) plus every open add-on — with a way to mark quantities
// delivered as they actually go out.
function deliveryRow(item, remaining, deliveredQty, source, recordId){
  return `<div class="ProdRow">
    <div class="ProdRow-info">
      <div class="ProdRow-name">${item.name}</div>
      <div class="ProdRow-meta">Remaining: ${remaining} ${item.unit}${deliveredQty>0?' · Delivered so far: '+deliveredQty:''}</div>
    </div>
    <div class="DualInput">
      <input class="SI" type="number" min="0" max="${remaining}" value="${remaining}" data-deliver-input="${source}|${recordId}|${item.id}">
      <button class="B B-red" data-deliver="${source}|${recordId}|${item.id}" style="height:40px;">✅</button>
    </div>
  </div>`;
}

async function showDeliveries(){
  showLoading();
  const darienPars=await loadPars('darien');
  const {data:latestD}=await sb.from(TABLE).select('*').eq('location','darien').eq('status','completed').order('completed_at',{ascending:false}).limit(1);
  const mainOrder=(latestD && latestD.length)?latestD[0]:null;
  const openAddons=await getOpenAddons();

  let mainRows='';
  if(mainOrder){
    const delivered=mainOrder.delivered||{};
    ALL_ITEMS.forEach(item=>{
      const par=darienPars[item.id];
      if(par==null) return;
      const onHand=Number(mainOrder.counts?.[item.id]||0);
      const need=Math.max(par-onHand,0);
      if(need<=0) return;
      const deliveredQty=Number(delivered[item.id]||0);
      const remaining=Math.max(need-deliveredQty,0);
      if(remaining<=0) return;
      mainRows+=deliveryRow(item,remaining,deliveredQty,'main',mainOrder.id);
    });
  }

  const addonBlocks=openAddons.map(a=>{
    const items=a.items||{};
    const delivered=a.delivered||{};
    const rows=Object.keys(items).map(itemId=>{
      const item=ITEM_BY_ID[itemId];
      if(!item) return '';
      const reqQty=Number(items[itemId]||0);
      const deliveredQty=Number(delivered[itemId]||0);
      const remaining=Math.max(reqQty-deliveredQty,0);
      if(remaining<=0) return '';
      return deliveryRow(item,remaining,deliveredQty,'addon',a.id);
    }).join('');
    const dateStr=new Date(a.created_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
    return `<div class="LocBlock" style="margin-bottom:16px;">
      <div style="padding:12px 16px;border-bottom:1px solid #F0F0F0;">
        <div class="LocHeader-name">Add-On · ${a.requested_by||'Unnamed'}</div>
        <div class="LocHeader-meta">Requested ${dateStr}</div>
      </div>
      ${rows || '<div style="padding:12px 16px;font-size:12px;color:#1B6B3A;">✓ Fully delivered</div>'}
    </div>`;
  }).join('');

  app.innerHTML = `
    <header class="H no-print">
      <div class="H-logo">Deliveries</div>
      <div class="H-right"><button class="B B-ghost" id="bBackDash">← Westmont</button></div>
    </header>
    <div class="Page" style="padding-top:12px;">
      <div style="font-size:12px;color:#777;font-weight:700;text-transform:uppercase;margin-bottom:8px;">This Week's Order</div>
      <div class="LocBlock" style="margin-bottom:20px;">${mainRows || '<div style="padding:16px;text-align:center;color:#999;font-size:13px;">Nothing outstanding.</div>'}</div>
      ${openAddons.length ? '<div style="font-size:12px;color:#777;font-weight:700;text-transform:uppercase;margin-bottom:8px;">Add-On Requests</div>'+addonBlocks : ''}
    </div>`;

  document.getElementById('bBackDash').onclick=()=>showDashboard('westmont');
  document.querySelectorAll('[data-deliver]').forEach(btn=>{
    btn.onclick=async ()=>{
      const [source,recordId,itemId]=btn.dataset.deliver.split('|');
      const input=document.querySelector(`[data-deliver-input="${source}|${recordId}|${itemId}"]`);
      const amt=Number(input.value||0);
      if(amt<=0) return;
      if(source==='main'){
        const {data:row}=await sb.from(TABLE).select('delivered').eq('id',recordId).single();
        const delivered={...(row?.delivered||{})};
        delivered[itemId]=Number(delivered[itemId]||0)+amt;
        await sb.from(TABLE).update({delivered}).eq('id',recordId);
      } else {
        const {data:row}=await sb.from('darien_addons').select('items,delivered').eq('id',recordId).single();
        const delivered={...(row?.delivered||{})};
        delivered[itemId]=Number(delivered[itemId]||0)+amt;
        const items=row?.items||{};
        const allDone=Object.keys(items).every(k=>Number(delivered[k]||0)>=Number(items[k]||0));
        await sb.from('darien_addons').update({delivered, status:allDone?'fulfilled':'open'}).eq('id',recordId);
      }
      showDeliveries();
    };
  });
}

// ─── PRINT CENTER ────────────────────────────────────────────────────────────

  const {data,error} = await sb.from(TABLE).select('*').eq('location',printLoc).eq('status','completed').order('completed_at',{ascending:false}).limit(26);
  const weeks = error ? [] : (data||[]);
  const addons = printLoc==='darien' ? await getAllAddonsForPrint() : [];

  const weekRows = weeks.map(w=>{
    const dateStr=new Date(w.completed_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

      <div class="ProdRow-info">

      </div>
      <div style="font-size:18px;color:#C8102E;">🖨</div>
    </div>`;
  }).join('');

  app.innerHTML = `
    <header class="H no-print">
      <div class="H-logo">Print</div>
      <div class="H-right"><button class="B B-ghost" id="bPrintBack">← Dashboard</button></div>
    </header>
    <div class="Page" style="padding-top:12px;">
      ${canChooseLocation ? `
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <button class="B ${printLoc==='westmont'?'B-red':'B-outline'}" id="bPrintWestmont" style="flex:1;justify-content:center;">🍳 Westmont Counts</button>
        <button class="B ${printLoc==='darien'?'B-red':'B-outline'}" id="bPrintDarien" style="flex:1;justify-content:center;">📦 Darien Order</button>
      </div>` : ''}
      <div style="font-size:12px;color:#777;font-weight:700;text-transform:uppercase;margin-bottom:8px;">Pick a week to print</div>
      <div class="LocBlock" style="margin-bottom:${addonRows?'16px':'0'};">${weekRows}</div>
      ${printLoc==='darien' && addonRows ? `<div style="font-size:12px;color:#777;font-weight:700;text-transform:uppercase;margin-bottom:8px;">Add-On Requests</div><div class="LocBlock">${addonRows}</div>` : ''}
    </div>`;

  document.getElementById('bPrintBack').onclick=()=>showDashboard(lk);
  if(canChooseLocation){
    document.getElementById('bPrintWestmont').onclick=()=>showPrintPicker(lk,'westmont');
    document.getElementById('bPrintDarien').onclick=()=>showPrintPicker(lk,'darien');
  }
  weeks.forEach(w=>{
    const el=document.querySelector(`[data-print-week="${w.id}"]`);
    if(el) el.onclick=()=>doPrint(w, LOCATIONS[printLoc], printLoc);
  });

    if(el) el.onclick=()=>doPrintAddon(a);
  });
}

function showSetupModal(lk){
  const l=LOCATIONS[lk];
  app.innerHTML = `<div class="Login"><div class="Login-logo" style="font-size:32px;">${l.name}</div></div>`;
  const el=document.createElement('div');
  el.className='Overlay'; el.id='modal';
  const isDarien = lk==='darien';
  const defaultDate = isDarien ? mostRecentSunday(new Date()) : mondayOf(new Date());
  const isoDefault=defaultDate.toISOString().slice(0,10);
  const fieldLabel = isDarien
    ? "Order received on (usually a Sunday — that Sunday's order is for the following week)"
    : "Week (pick any day — snaps to that week's Monday)";
  el.innerHTML = `<div class="Modal">
    <div class="Modal-title">${testMode?'🧪 ':''}Start counting — ${l.name}${testMode?' (test)':''}</div>
    <div class="Modal-field">
      <label>${fieldLabel}</label>
      <input type="date" id="setupWeekDate" value="${isoDefault}">
      <div id="setupWeekPreview" style="font-size:12px;color:#1B6B3A;font-weight:700;margin-top:6px;"></div>
    </div>
    <div class="Modal-field"><label>Counter's name</label><input id="setupName" placeholder="e.g. Maria"></div>
    <div class="Modal-actions">
      <button class="B B-outline" id="setupCancel">Cancel</button>
      <button class="B B-red" id="setupStart">Start Counting</button>
    </div>
  </div>`;
  document.body.appendChild(el);

  function updateWeekPreview(){
    const raw=document.getElementById('setupWeekDate').value;
    const preview=document.getElementById('setupWeekPreview');
    if(!raw || !preview) return;
    const picked=new Date(raw+'T00:00:00');
    const mon=isDarien ? targetMondayForDarienOrder(picked) : mondayOf(picked);
    const wk=weekNumberForDate(mon);
    const sundayNote = isDarien && picked.getDay()===0 ? ' (Sunday order → following week)' : '';
    preview.textContent = 'Week '+wk+' · '+weekRangeLabel(wk)+sundayNote;
  }
  document.getElementById('setupWeekDate').oninput=updateWeekPreview;
  updateWeekPreview();

  document.getElementById('setupCancel').onclick=()=>{ closeModal(); showDashboard(lk); };
  document.getElementById('setupStart').onclick=async ()=>{
    const raw=document.getElementById('setupWeekDate').value;
    const picked = raw ? new Date(raw+'T00:00:00') : new Date();
    const monday = isDarien ? targetMondayForDarienOrder(picked) : mondayOf(picked);
    const week = 'Week of '+monday.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const counter=document.getElementById('setupName').value.trim()||'Unnamed';
    closeModal();
    if(testMode){
      session={id:'test-'+Date.now(), location:lk, week_label:week, counter_name:counter, counts:{}, status:'in_progress', started_at:monday.toISOString()};
      testSessions[lk]=session;
      openCat=CATEGORIES[0].name;
      currentPars=await loadPars(lk);
      currentDarienOwed = lk==='westmont' ? await getDarienOwedMap() : {};
      showCount();
      return;
    }
    showLoading();
    const {data,error}=await sb.from(TABLE).insert({location:lk,week_label:week,counter_name:counter,counts:{},status:'in_progress',started_at:monday.toISOString()}).select().single();
    if(error){ alert('Could not start session: '+error.message); showDashboard(lk); return; }
    session=data; session.counts=session.counts||{};
    openCat=CATEGORIES[0].name;
    currentPars=await loadPars(lk);
    currentDarienOwed = lk==='westmont' ? await getDarienOwedMap() : {};
    showCount();
  };
}

// ─── COUNT VIEW ──────────────────────────────────────────────────────────────
function showCount(){
  const l=LOCATIONS[activeLoc];
  const done=allComplete();
  const counted=totalCounted(), total=totalItems();

  const blocks = CATEGORIES.map((cat,ci)=>{
    const filled=catFilledCount(cat);
    const complete=catComplete(cat);
    const isOpen=openCat===cat.name;
    const badgeCls = complete?'badge-done':'badge-active';
    const badgeTxt = complete?'✓ Done':filled+' / '+cat.items.length;

    const rows = cat.items.map((item,idx)=>{
      const val=session.counts[item.id] ?? '';
      const totalTxt = val!=='' ? ('= '+(Number(val)*item.mult)+' '+item.baseUnit) : '';

      if(activeLoc==='darien'){
        const par=currentPars[item.id];
        const parTxt = par!=null ? ('Par '+par) : 'No par set yet';
        const need = (par!=null && val!=='') ? Math.max(par-Number(val),0) : null;
        return `<div class="ProdRow">
          <div class="ProdRow-info">
            <div class="ProdRow-name">${item.name}</div>
            <div class="ProdRow-meta">${item.unit} · ${parTxt}</div>
          </div>
          <div class="DualInput">
            <div class="IG"><label>On Hand</label>
              <input class="SI${val!==''?' filled':''}" type="number" min="0" inputmode="numeric"
                data-item="${item.id}" data-cat="${cat.name}" value="${val}" placeholder="0">
            </div>
            <div class="IG"><label>Need</label>
              <div class="SI-readonly" data-need="${item.id}">${need!=null?need:'—'}</div>
            </div>
          </div>
        </div>`;
      }

      const owed = currentDarienOwed[item.id];
      const hasOwed = owed>0;
      const owedBase = hasOwed ? owed*item.mult : 0;
      const trueBase = (hasOwed && val!=='') ? Number(val)*item.mult-owedBase : null;
      const trueColorVal = trueBase!=null ? (trueBase<0?'#C8102E':'#1B6B3A') : '#999';

      return `<div class="ProdRow" style="${hasOwed?'background:#FFFBF0;':''}">
        <div class="ProdRow-info">
          <div class="ProdRow-name">${item.name}</div>
          <div class="ProdRow-meta">${item.unit}${totalTxt?' · <span class="ProdRow-total" data-total="'+item.id+'">'+totalTxt+'</span>':'<span class="ProdRow-total" data-total="'+item.id+'"></span>'}</div>
        </div>
        <div class="DualInput">
          <div class="IG"><label>${l.fieldLabel}</label>
            <input class="SI${val!==''?' filled':''}" type="number" min="0" inputmode="numeric"
              data-item="${item.id}" data-cat="${cat.name}" value="${val}" placeholder="0">
          </div>
          ${hasOwed ? `
          <div class="IG"><label style="color:#8A6300;">− DARIEN</label>
            <div class="SI-readonly" style="border-color:#8A6300;background:#FFF3D6;color:#8A6300;font-size:18px;" data-owed="${item.id}">${owedBase}</div>
          </div>
          <div class="IG"><label style="color:${trueColorVal};">TRUE COUNT</label>
            <div class="SI-readonly" style="border-color:${trueColorVal};background:#fff;color:${trueColorVal};font-size:20px;font-weight:800;width:64px;" data-true="${item.id}">${trueBase!=null?trueBase:'—'}</div>
          </div>` : ''}
        </div>
      </div>`;
    }).join('');

    return `<div class="LocBlock" id="cb-${ci}">
      <div class="LocHeader" data-cat="${cat.name}" data-ci="${ci}">
        <span class="LocHeader-arrow${isOpen?' open':''}">›</span>
        <div class="LocHeader-info">
          <div class="LocHeader-name">${cat.name}</div>
          <div class="LocHeader-meta">${cat.items.length} item${cat.items.length!==1?'s':''}</div>
        </div>
        <span class="LocHeader-badge ${badgeCls}">${badgeTxt}</span>
      </div>
      <div class="LocBody${isOpen?' open':''}">${rows}</div>
    </div>`;
  }).join('');

  app.innerHTML = `
    <header class="H no-print">
      <div class="H-logo">${l.name}</div>
      <div class="H-right">
        <button class="B B-ghost" id="bAvg">📊 Averages</button>
        <button class="B B-ghost" id="bHome">← Dashboard</button>
      </div>
    </header>
    <div class="Page">
      ${testMode?'<div style="background:#FDECEA;color:#C8102E;font-size:12px;font-weight:700;padding:8px 12px;border-radius:8px;margin-bottom:10px;text-align:center;">🧪 TEST MODE — nothing here is saved to Supabase</div>':''}
      ${session.completed_at?'<div style="background:#FFF6E0;color:#8A6300;font-size:12px;font-weight:700;padding:8px 12px;border-radius:8px;margin-bottom:10px;text-align:center;">✏️ Editing a previously submitted week — finishing again will override it'+(activeLoc==='darien'?' and require re-acknowledgment':'')+'</div>':''}
      <div style="font-size:11px;color:#777;margin-bottom:10px;">${session.week_label} · Counted by ${session.counter_name}</div>
      ${blocks}
    </div>
    <div class="Footer no-print">
      <button class="Fbtn" id="bHome2">← Dashboard</button>
      <div class="Footer-prog">${done?'All counted! 🎉':counted+' / '+total+' items'}</div>
      <button class="Fbtn" id="bClear">🗑 Clear</button>
      <button class="Fbtn Fbtn-next" id="bFinish">${activeLoc==='darien'?'✅ I Confirm — Accurate':'✅ Finish &amp; Print'}</button>
    </div>`;

  document.getElementById('bHome').onclick=document.getElementById('bHome2').onclick=()=>showDashboard(activeLoc);
  document.getElementById('bAvg').onclick=()=>showAverages();
  document.getElementById('bClear').onclick=()=>{
    showModal('Clear this count?','This erases every entry for '+session.week_label+' at '+l.name+'. The session stays open so you can start over.',[
      {l:'Cancel',c:'B-outline',fn:closeModal},
      {l:'Clear',c:'B-red',fn:async ()=>{ closeModal(); session.counts={}; await saveCounts(true); showCount(); }},
    ]);
  };
  document.getElementById('bFinish').onclick=()=>{
    if(activeLoc==='darien'){
      showCertifyModal();
      return;
    }
    showModal('Finish this count?','This saves the final counts for '+session.week_label+', opens a printable ticket, and resets '+l.name+' back to zero for next time.',[
      {l:'Cancel',c:'B-outline',fn:closeModal},
      {l:'Finish',c:'B-red',fn:async ()=>{ closeModal(); await finishAndPrint(); }},
    ]);
  };

  document.querySelectorAll('.LocHeader').forEach(hdr=>{
    hdr.onclick=()=>{
      const cat=hdr.dataset.cat;
      openCat=(openCat===cat?null:cat);
      showCount();
      if(openCat===cat){
        setTimeout(()=>{
          document.getElementById('cb-'+hdr.dataset.ci)?.scrollIntoView({behavior:'smooth',block:'start'});
        },50);
      }
    };
  });

  let advanceTimer=null;
  const allInputs=[...document.querySelectorAll('.SI')];
  allInputs.forEach((input,i)=>{
    input.oninput=()=>{
      const itemId=input.dataset.item, cat=input.dataset.cat;
      session.counts[itemId]=input.value;
      input.classList.toggle('filled', input.value!=='');
      refreshBadge(cat);
      refreshFooter();
      refreshTotal(itemId);
      refreshNeed(itemId);
      refreshTrue(itemId);
      queueSave();

      clearTimeout(advanceTimer);
      if(input.value!==''){
        // wait for a pause in typing (not just the first digit) before jumping ahead
        advanceTimer=setTimeout(()=>{
          const next=allInputs[i+1];
          if(next && next.dataset.cat===cat) next.focus();
        },900);
      }
      const catObj=CATEGORIES.find(c=>c.name===cat);
      if(catComplete(catObj)){
        const ci=CATEGORIES.indexOf(catObj), nextCat=CATEGORIES[ci+1];
        if(nextCat && openCat===cat){
          setTimeout(()=>{ openCat=nextCat.name; showCount(); document.getElementById('cb-'+(ci+1))?.scrollIntoView({behavior:'smooth',block:'start'}); },900);
        }
      }
    };
    input.onclick=e=>e.stopPropagation();
  });
}

function refreshBadge(catName){
  const cat=CATEGORIES.find(c=>c.name===catName);
  const badge=document.querySelector(`.LocHeader[data-cat="${catName}"] .LocHeader-badge`);
  if(!badge) return;
  const complete=catComplete(cat);
  badge.className='LocHeader-badge '+(complete?'badge-done':'badge-active');
  badge.textContent=complete?'✓ Done':catFilledCount(cat)+' / '+cat.items.length;
}
function refreshFooter(){
  const prog=document.querySelector('.Footer-prog');
  if(!prog) return;
  prog.textContent = allComplete() ? 'All counted! 🎉' : totalCounted()+' / '+totalItems()+' items';
}
function refreshTotal(itemId){
  const el=document.querySelector(`[data-total="${itemId}"]`);
  if(!el) return;
  const item=ITEM_BY_ID[itemId];
  const val=session.counts[itemId];
  el.textContent = (val!=='' && val!=null) ? ('= '+(Number(val)*item.mult)+' '+item.baseUnit) : '';
}
function refreshNeed(itemId){
  if(activeLoc!=='darien') return;
  const el=document.querySelector(`[data-need="${itemId}"]`);
  if(!el) return;
  const par=currentPars[itemId];
  const val=session.counts[itemId];
  if(par==null || val==='' || val==null){ el.textContent='—'; return; }
  el.textContent = Math.max(par-Number(val),0);
}

function refreshTrue(itemId){
  if(activeLoc!=='westmont') return;
  const el=document.querySelector(`[data-true="${itemId}"]`);
  if(!el) return;
  const owed=currentDarienOwed[itemId];
  if(!(owed>0)) return; // box doesn't exist for this item, nothing to update
  const item=ITEM_BY_ID[itemId];
  const val=session.counts[itemId];
  const owedBase=owed*item.mult;
  if(val==='' || val==null){
    el.textContent='—';
    el.style.color='#999';
    el.style.borderColor='#999';
    return;
  }
  const trueBase=Number(val)*item.mult-owedBase;
  const color = trueBase<0?'#C8102E':'#1B6B3A';
  el.textContent=trueBase;
  el.style.color=color;
  el.style.borderColor=color;
}

function queueSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>saveCounts(false),500);
}
async function saveCounts(){
  if(!session) return;
  if(testMode) return; // test mode never touches Supabase
  await sb.from(TABLE).update({counts:session.counts}).eq('id',session.id);
}

// ─── FINISH + PRINT ──────────────────────────────────────────────────────────
async function finishAndPrint(cert){
  const completedAt=new Date().toISOString();
  const lk=activeLoc;
  const counts = cert ? {...session.counts, _certified_by:cert.certifiedBy, _certified_at:cert.certifiedAt} : session.counts;
  if(testMode){
    doPrint({...session, counts, completed_at:completedAt}, LOCATIONS[lk], lk);
    testSessions[lk]=null;
    showDashboard(lk);
    return;
  }
  showLoading();
  await sb.from(TABLE).update({counts, status:'completed', completed_at:completedAt, acknowledged:false, acknowledged_at:null}).eq('id',session.id);
  doPrint({...session, counts, completed_at:completedAt}, LOCATIONS[lk], lk);
  showDashboard(lk);
}

function doPrint(finalSession, loc, lk){
  const date=new Date(finalSession.completed_at).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  const isDarien = lk==='darien';
  let tableRows='';
  CATEGORIES.forEach(cat=>{
    tableRows+=`<tr><td colspan="4" style="background:#1A1A2E;color:#fff;font-weight:700;padding:4px 8px;font-size:9px;text-transform:uppercase;letter-spacing:0.08em;border-top:2px solid #000;border-bottom:2px solid #000;">${cat.name}</td></tr>
    <tr>
      <td style="background:#A50E1F;color:#fff;font-weight:700;padding:3px 8px;font-size:9px;text-transform:uppercase;width:40%;border-right:1px solid #8B0000;">Item</td>
      ${isDarien
        ? `<td style="background:#A50E1F;color:#fff;font-weight:700;padding:3px 8px;font-size:9px;text-transform:uppercase;width:20%;border-right:1px solid #8B0000;">Par</td>
      <td style="background:#A50E1F;color:#fff;font-weight:700;padding:3px 8px;font-size:9px;text-transform:uppercase;width:20%;border-right:1px solid #8B0000;">On Hand</td>
      <td style="background:#A50E1F;color:#fff;font-weight:700;padding:3px 8px;font-size:9px;text-transform:uppercase;width:20%;">Need</td>`
        : `<td style="background:#A50E1F;color:#fff;font-weight:700;padding:3px 8px;font-size:9px;text-transform:uppercase;width:25%;border-right:1px solid #8B0000;">Unit</td>
      <td style="background:#A50E1F;color:#fff;font-weight:700;padding:3px 8px;font-size:9px;text-transform:uppercase;width:17%;border-right:1px solid #8B0000;">${loc.fieldLabel}</td>
      <td style="background:#A50E1F;color:#fff;font-weight:700;padding:3px 8px;font-size:9px;text-transform:uppercase;width:18%;">Total</td>`
      }
    </tr>`;
    cat.items.forEach(item=>{
      const val=finalSession.counts[item.id] ?? '';
      if(isDarien){
        const par=currentPars[item.id];
        const need=(par!=null && val!=='') ? Math.max(par-Number(val),0) : '';
        tableRows+=`<tr>
        <td style="padding:3px 8px;border:1px solid #DDD;font-size:9px;font-family:'Inter',system-ui,sans-serif;">${item.name}</td>
        <td style="padding:3px 8px;border:1px solid #DDD;font-size:9px;color:#555;text-align:center;font-family:'Inter',system-ui,sans-serif;">${par!=null?par:'—'}</td>
        <td style="padding:3px 8px;border:1px solid #DDD;font-size:9px;text-align:center;font-weight:700;color:#111;font-family:'Inter',system-ui,sans-serif;">${val}</td>
        <td style="padding:3px 8px;border:1px solid #DDD;font-size:9px;text-align:center;font-weight:700;color:#1B6B3A;font-family:'Inter',system-ui,sans-serif;">${need}</td>
      </tr>`;
        return;
      }
      const totalTxt = val!=='' ? (Number(val)*item.mult)+' '+item.baseUnit : '';
      tableRows+=`<tr>
        <td style="padding:3px 8px;border:1px solid #DDD;font-size:9px;font-family:'Inter',system-ui,sans-serif;">${item.name}</td>
        <td style="padding:3px 8px;border:1px solid #DDD;font-size:9px;color:#555;font-family:'Inter',system-ui,sans-serif;">${item.unit}</td>
        <td style="padding:3px 8px;border:1px solid #DDD;font-size:9px;text-align:center;font-weight:700;color:#C8102E;font-family:'Inter',system-ui,sans-serif;">${val}</td>
        <td style="padding:3px 8px;border:1px solid #DDD;font-size:9px;text-align:center;font-weight:700;color:#1B6B3A;font-family:'Inter',system-ui,sans-serif;">${totalTxt}</td>
      </tr>`;
    });
  });

  document.getElementById('print-area').innerHTML = `
    <div style="font-family:'Inter',system-ui,sans-serif;font-size:9px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #1A1A2E;padding-bottom:4px;margin-bottom:6px;">
        <div>
          <div style="font-size:14px;font-weight:700;color:#C8102E;text-transform:uppercase;letter-spacing:0.05em;font-family:'Libre Baskerville',Georgia,serif;">${isDarien?'DARIEN ORDER':'WESTMONT STORE PREP'}</div>
          <div style="font-size:8px;font-weight:700;text-transform:uppercase;color:#333;margin-top:2px;letter-spacing:0.06em;">${finalSession.week_label}</div>
        </div>
        <div style="text-align:right;font-size:8px;color:#555;line-height:1.7;">
          <div>Date: ${date}</div>
          <div>Counted by: ${finalSession.counter_name}</div>
          ${isDarien && finalSession.counts?._certified_by ? `<div style="color:#1B6B3A;font-weight:700;">Certified by: ${finalSession.counts._certified_by}</div><div>Certified: ${new Date(finalSession.counts._certified_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div>` : ''}
        </div>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:9px;table-layout:fixed;"><tbody>${tableRows}</tbody></table>
    </div>`;
  window.print();
}

// ─── AVERAGES ────────────────────────────────────────────────────────────────
async function showAverages(){
  const l=LOCATIONS[activeLoc];
  showModal('6-Week Average — '+l.name, `<div id="avgBody">Loading…</div>`, [
    {l:'Close',c:'B-outline',fn:closeModal},
  ]);
  const {data,error}=await sb.from(TABLE).select('*').eq('location',activeLoc).eq('status','completed').order('completed_at',{ascending:false}).limit(6);
  const body=document.getElementById('avgBody');
  if(!body) return;
  if(error){ body.textContent='Could not load averages.'; return; }
  if(!data || data.length===0){ body.textContent='No completed weeks yet.'; return; }
  const rows = ALL_ITEMS.map(item=>{
    const vals=data.map(d=>Number(d.counts?.[item.id]||0));
    const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
    return `<div class="AvgRow"><div class="AvgRow-name">${item.name}</div><div class="AvgRow-val">${avg.toFixed(1)}</div></div>`;
  }).join('');
  body.innerHTML = `<div style="font-size:11px;color:#999;margin-bottom:8px;">Based on last ${data.length} completed week${data.length!==1?'s':''}</div>${rows}`;
}

// ─── MODAL ───────────────────────────────────────────────────────────────────
function showModal(title, body, btns){
  closeModal();
  const el=document.createElement('div');
  el.className='Overlay'; el.id='modal';
  el.innerHTML=`<div class="Modal">
    <div class="Modal-title">${title}</div>
    <div class="Modal-body">${body}</div>
    <div class="Modal-actions">${btns.map((b,i)=>`<button class="B ${b.c}" data-i="${i}">${b.l}</button>`).join('')}</div>
  </div>`;
  document.body.appendChild(el);
  el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>btns[+b.dataset.i].fn());
}
function closeModal(){ document.getElementById('modal')?.remove(); }

// ─── CERTIFICATION (Darien order sign-off) ──────────────────────────────────
function showCertifyModal(){
  closeModal();
  const el=document.createElement('div');
  el.className='Overlay'; el.id='modal';
  el.innerHTML = `<div class="Modal">
    <div class="Modal-title">Certify this order</div>
    <div class="Modal-body">I acknowledge and have reviewed the quantities to be ordered below and verify that they are correct.</div>
    <div class="Modal-field">
      <label>Certified by</label>
      <input id="certifyName" value="${(session.counter_name||'').replace(/"/g,'&quot;')}" placeholder="Your name">
    </div>
    <div style="display:flex;align-items:flex-start;gap:10px;margin:6px 0 18px;">
      <input type="checkbox" id="certifyCheck" style="width:22px;height:22px;margin-top:2px;flex-shrink:0;accent-color:#C8102E;">
      <label for="certifyCheck" style="font-size:13px;color:#444;line-height:1.45;">I certify that I have reviewed these quantities and they are accurate.</label>
    </div>
    <div class="Modal-actions">
      <button class="B B-outline" id="certifyCancel">Cancel</button>
      <button class="B B-red" id="certifyOk" disabled style="opacity:0.35;">OK</button>
    </div>
  </div>`;
  document.body.appendChild(el);

  const checkbox=document.getElementById('certifyCheck');
  const okBtn=document.getElementById('certifyOk');
  checkbox.onchange=()=>{
    okBtn.disabled=!checkbox.checked;
    okBtn.style.opacity=checkbox.checked?'1':'0.35';
  };
  document.getElementById('certifyCancel').onclick=closeModal;
  okBtn.onclick=async ()=>{
    if(!checkbox.checked) return;
    const name=document.getElementById('certifyName').value.trim()||session.counter_name||'Unnamed';
    const certifiedAt=new Date().toISOString();
    closeModal();
    await finishAndPrint({certifiedBy:name, certifiedAt});
  };
}
</script>
</body>
